[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectravortex"
version = "0.1.0"
description = "Programming language for photonic computing"
readme = "README.md"
authors = [{name = "Dimius0"}]
license = "MIT"  # Изменено с таблицы на строку
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy",
]

# КРИТИЧЕСКИЙ ФИКС: явно указываем пакеты для сборки
[project.packages.find]
where = ["."]  # Искать пакеты в корневой директории
include = ["compiler", "simulator"]  # Конкретно указываем, какие папки включать

[project.optional-dependencies]
dev = [
    "pytest",
]
