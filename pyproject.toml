[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectravortex"
version = "0.1.0"
authors = [{name = "Dimius0"}]
description = "A declarative language for photonic computing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]

# ЯВНО УКАЗЫВАЕМ ПАКЕТЫ (решает ошибку "Multiple top-level packages")
packages = [
    {include = "compiler"},
    {include = "simulator"},
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/Dimius0/spectravortex"
