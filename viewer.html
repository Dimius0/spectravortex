<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SpectraVortex v3.9.3 — Честная. Из первых принципов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; }
        
        #controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 8px 12px; border-radius: 12px;
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
            z-index: 100; border-top: 1px solid #333;
            font-size: 10px;
        }
        button {
            background: #1a1a2e; color: #0ff; border: 1px solid #0ff;
            padding: 4px 10px; cursor: pointer; font-family: monospace;
            font-size: 10px; transition: all 0.2s; border-radius: 6px;
        }
        button:hover { background: #0ff; color: #000; }
        button.active { background: #ff3366; border-color: #ff3366; color: #fff; }
        button.learn-active { background: #44aa44; border-color: #44ffaa; color: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; background: #111; color: #555; border-color: #333; }
        button:disabled:hover { background: #111; color: #555; }
        
        .slider-container { display: flex; align-items: center; gap: 4px; background: #111; padding: 2px 8px; border-radius: 16px; }
        input[type="range"] { width: 80px; height: 3px; accent-color: #ffaa44; }
        input[type="number"] {
            width: 50px; background: #111; color: #0ff; border: 1px solid #333;
            padding: 2px 4px; font-family: monospace; font-size: 10px; border-radius: 4px;
        }
        
        .error-hunter {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            border-radius: 12px; padding: 6px 12px;
            display: flex; gap: 10px; flex-wrap: wrap;
            z-index: 100; border-left: 3px solid #ff3366;
            font-size: 9px;
        }
        .param-group { display: flex; gap: 5px; align-items: center; cursor: help; }
        .param-group span:first-child { min-width: 45px; }
        
        .measure-panel {
            position: absolute; bottom: 100px; right: 20px;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(8px);
            border-radius: 12px; padding: 10px 14px;
            border-right: 3px solid #44ffaa;
            font-family: monospace; font-size: 9px;
            z-index: 100; min-width: 280px;
            display: none;
        }
        .measure-panel .title { color: #44ffaa; margin-bottom: 6px; font-size: 11px; }
        .measure-panel .close-btn { float: right; cursor: pointer; color: #ff6666; margin-left: 10px; }
        
        .legend {
            position: absolute; bottom: 100px; left: 20px;
            background: rgba(0,0,0,0.6); padding: 4px 8px;
            border-radius: 8px; font-size: 7px; color: #ccc;
            pointer-events: none;
        }
        
        .learn-tooltip {
            position: fixed;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(12px);
            border-left: 3px solid #44ffaa;
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 280px;
            z-index: 10000;
            font-family: monospace;
            font-size: 10px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .learn-tooltip .tt-title { color: #44ffaa; font-size: 12px; margin-bottom: 4px; }
        .learn-tooltip .tt-formula { color: #ffaa44; font-size: 9px; margin-bottom: 6px; border-top: 1px solid #333; padding-top: 5px; }
        .learn-tooltip .tt-desc { color: #ccc; line-height: 1.3; margin-bottom: 8px; }
        
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
            font-family: monospace;
        }
        .loading-container { text-align: center; background: rgba(10,10,30,0.9); padding: 25px 40px; border-radius: 25px; border: 1px solid #44ffaa33; }
        .vortex-loader { position: relative; width: 80px; height: 80px; margin: 0 auto 15px; }
        .vortex-core { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: #ff3366; border-radius: 50%; transform: translate(-50%, -50%); animation: pulse-core 1s ease infinite; }
        .vortex-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid #44ffaa; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; }
        .vortex-ring2 { position: absolute; top: 12px; left: 12px; width: calc(100% - 24px); height: calc(100% - 24px); border: 2px solid #ffaa44; border-radius: 50%; border-bottom-color: transparent; animation: spin-reverse 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }
        @keyframes pulse-core { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }
        .loading-message { font-size: 12px; margin-bottom: 8px; color: #44ffaa; }
        .loading-progress { width: 180px; height: 2px; background: #333; margin: 12px auto 0; border-radius: 2px; overflow: hidden; }
        .loading-progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #44ffaa, #ffaa44); }
        
        input[type="file"] { display: none; }
        .mode-banner {
            position: absolute; top: 80px; left: 20px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 6px 14px; border-radius: 12px;
            font-family: monospace; font-size: 10px; z-index: 100;
            border-left: 3px solid #44ffaa;
        }
        .mode-banner.demo { border-left-color: #44ffaa; color: #44ffaa; }
        .mode-banner.analysis { border-left-color: #ffaa44; color: #ffaa44; }
        .frame-info {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            padding: 4px 10px; border-radius: 10px;
            font-family: monospace; font-size: 11px; color: #ffaa44; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="loadBtn">📂 JSON</button>
        <button id="playBtn" disabled>▶</button>
        <button id="prevFrameBtn" disabled>◀</button>
        <input type="number" id="frameInput" value="0" min="0" max="0" disabled style="width:55px;">
        <button id="nextFrameBtn" disabled>▶</button>
        <button id="resetViewBtn">🎥 Сброс</button>
        <button id="toggleProjectionBtn">📐 Перспектива</button>
        <button id="toggleModeBtn" class="active">📚 Демо</button>
        <button id="toggleCocoonBtn" class="active">🌀 Коконы</button>
        <button id="toggleFieldBtn" class="active">🌊 Поле</button>
        <button id="toggleTauBtn">⚡ τ-жилы</button>
        <button id="toggleFlowBtn" class="active">🔗 Связи</button>
        <button id="toggleTrailsBtn" disabled>🐾 Траектории</button>
        <button id="learnModeBtn">📚 Обучение</button>
        <div class="slider-container"><span>🌀 Прозр.кок</span><input type="range" id="opacitySlider" min="0.1" max="0.7" step="0.01" value="0.35"></div>
        <div class="slider-container"><span>💡 Яркость</span><input type="range" id="brightnessSlider" min="0.3" max="1.5" step="0.01" value="1.0"></div>
        <div class="slider-container"><span>🎞️ Кадр</span><input type="range" id="frameSlider" min="0" max="0" value="0" step="1" disabled></div>
        <input type="file" id="fileInput" accept=".json">
        <button id="exportCsvBtn" disabled>📥 CSV</button>
    </div>

    <div class="mode-banner demo" id="modeBanner">📚 ДЕМО-РЕЖИМ: обучение и формирование интуиции</div>
    <div class="frame-info">📊 <span id="frameLabel">0</span>/<span id="totalFrames">0</span></div>

    <div class="error-hunter" id="errorHunter">
        <div class="param-group" title="Температура среды. В ВММП — интенсивность флуктуаций вихревого поля.">🌡️ <span>Темп.</span><input type="range" id="tempSlider" min="0" max="2000" value="300" step="10"><span id="tempVal">300K</span></div>
        <div class="param-group" title="Внешнее давление. В ВММП — градиент плотности вихревого поля.">💥 <span>Давл.</span><input type="range" id="pressureSlider" min="0.1" max="10" value="1" step="0.1"><span id="pressureVal">1.0</span></div>
        <div class="param-group" title="Напряжённость внешнего поля H. В ВММП — градиент циркуляции.">⚡ <span>Поле H</span><input type="range" id="fieldSlider" min="0" max="1.5" value="0.5" step="0.01"><span id="fieldVal">0.50</span></div>
        <div class="param-group" title="Чистота системы. 1 = идеальная, <0.3 = критический риск.">🧪 <span>Чистота</span><input type="range" id="puritySlider" min="0" max="1" value="0.9" step="0.01"><span id="purityVal">0.90</span></div>
    </div>

    <div class="measure-panel" id="measurePanel">
        <div class="title">📏 ИЗМЕРИТЕЛЬ <span class="close-btn" id="closeMeasureBtn">✕</span></div>
        <div id="measureContent">Выберите два атома кликами (Esc — сброс)</div>
    </div>

    <div class="legend" id="legend">🌑 Ядро | 🌀 Кокон | ✨ Поле | 🔗 Связи (гантель) | 🐾 Траектории | 📚 Обучение: наведи</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        scene.fog = new THREE.FogExp2(0x030318, 0.002);
        
        const aspect = window.innerWidth / window.innerHeight;
        const perspCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 500);
        perspCamera.position.set(18, 14, 22);
        const orthoCamera = new THREE.OrthographicCamera(-10 * aspect, 10 * aspect, 10, -10, 0.1, 500);
        orthoCamera.position.set(18, 14, 22);
        
        let camera = perspCamera;
        let isOrthographic = false;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.zoomSpeed = 1.2;
        
        // ============ ОСВЕЩЕНИЕ ============
        const ambientLight = new THREE.AmbientLight(0x404060, 0.85);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
        mainLight.position.set(8, 15, 5);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4488ff, 0.5);
        fillLight.position.set(-4, 3, 6);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(0, 2, -10);
        scene.add(backLight);
        
        // ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
        let trajectoryData = [];
        let currentFrame = 0;
        let playing = false;
        let lastFrameTime = 0;
        const FRAME_INTERVAL = 100;
        let time = 0;
        let updateTimeout = null;
        let measureResetTimeout = null;
        
        let vortexGroup = new THREE.Group();
        let interfaceGroup = new THREE.Group();
        let fieldGroup = new THREE.Group();
        let flowLinesGroup = new THREE.Group();
        let highlightGroup = new THREE.Group();
        let trailsGroup = new THREE.Group();
        
        scene.add(vortexGroup);
        scene.add(interfaceGroup);
        scene.add(fieldGroup);
        scene.add(flowLinesGroup);
        scene.add(highlightGroup);
        scene.add(trailsGroup);
        
        let analysisMode = false;
        let showCocoon = true;
        let showField = true;
        let showTau = true;
        let showFlowLines = true;
        let showTrails = false;
        let learnMode = false;
        
        let cocoonEnergyVal = 0.5, fieldRadiationVal = 0.3;
        let vortices = [];
        let fieldParticles = null;
        let selectedForMeasure = [];
        let measurePanel = document.getElementById('measurePanel');
        
        let positionHistory = [];
        const TRAIL_LENGTH = 10;
        
        let temperature = 300, pressure = 1.0, externalField = 0.5, purity = 0.9;
        
        const groupColors = ['#ff3366', '#ff8844', '#ffdd44', '#44cc44', '#44aaff', '#aa66ff', '#ff66cc'];
        const groupRadii = {1:0.55, 2:0.75, 3:0.95, 4:1.15, 5:1.35, 6:1.55, 7:1.75};
        
        function getTauColor(tau) {
            const hue = 0.55 + (tau || 0) * 0.1;
            return new THREE.Color().setHSL(Math.min(0.85, Math.max(0.3, hue)), 1.0, 0.65);
        }
        
        function getGroupColor(group) {
            return new THREE.Color(groupColors[(group-1) % 7]);
        }
        
        function debouncedUpdate() {
            if (updateTimeout) clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => updateDynamics(), 30);
        }
        
        function setProjection(ortho) {
            if (ortho === isOrthographic) return;
            isOrthographic = ortho;
            const oldPos = camera.position.clone();
            const oldTarget = controls.target.clone();
            if (ortho) { orthoCamera.position.copy(oldPos); camera = orthoCamera; }
            else { perspCamera.position.copy(oldPos); camera = perspCamera; }
            controls.object = camera;
            controls.target.copy(oldTarget);
            controls.update();
        }
        
        function createVortex(x, y, z, group, tau, index, customSymbol, customRadius) {
            const groupObj = new THREE.Group();
            const radius = customRadius || (groupRadii[group] * 0.5);
            const groupColor = getGroupColor(group);
            const coreMat = new THREE.MeshStandardMaterial({ color: groupColor, emissive: groupColor, emissiveIntensity: 0.3 });
            const core = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), coreMat);
            core.name = 'core';
            groupObj.add(core);
            
            const filamentMat = new THREE.MeshStandardMaterial({ color: getTauColor(tau), emissive: getTauColor(tau), emissiveIntensity: 0.7 });
            const filament = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.15, 32, 32), filamentMat);
            filament.name = 'filament';
            groupObj.add(filament);
            groupObj.position.set(x, y, z);
            
            const div = document.createElement('div');
            const sym = customSymbol || ((index < 118) ? getElementSymbol(index) : (index + 1).toString());
            div.textContent = sym;
            div.style.color = '#fff';
            div.style.fontSize = '10px';
            div.style.fontWeight = 'bold';
            div.style.fontFamily = 'monospace';
            div.style.textShadow = '0 0 3px #000';
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.padding = '1px 4px';
            div.style.borderRadius = '10px';
            div.style.border = `1px solid ${groupColors[(group-1)%7]}`;
            const label = new THREE.CSS2DObject(div);
            label.position.set(0, radius * 1.5, 0);
            label.name = 'label';
            groupObj.add(label);
            
            return { groupObj, core, filament, tau, label, index, x, y, z, group, radius, groupColor };
        }
        
        function getElementSymbol(n) {
            const syms = ['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca',
                         'Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr','Rb','Sr','Y','Zr',
                         'Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe','Cs','Ba','La','Ce','Pr',
                         'Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt',
                         'Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk',
                         'Cf','Es','Fm','Md','No','Lr','Rf','Db','Sg','Bh','Hs','Mt','Ds','Rg','Cn','Nh','Fl','Mc','Lv','Ts','Og'];
            return (n >= 0 && n < syms.length) ? syms[n] : '?';
        }
        
        // ИСПРАВЛЕНО №1,6: радиус кокона = радиус ядра. Гантель при связи.
        function createCocoon(x, y, z, radius, group) {
            const groupColor = getGroupColor(group);
            const mat = new THREE.MeshPhongMaterial({
                color: groupColor,
                emissive: 0x112233,
                transparent: true, opacity: 0.3,
                side: THREE.DoubleSide, shininess: 60
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
            sphere.scale.set(radius, radius, radius);
            sphere.position.set(x, y, z);
            sphere.name = 'cocoon';
            return sphere;
        }
        
        // ИСПРАВЛЕНО №6: коконы-гантели при перекрытии
        function createDumbbellCocoon(v1, v2) {
            const group = new THREE.Group();
            const dist = v1.groupObj.position.distanceTo(v2.groupObj.position);
            const r1 = v1.radius;
            const r2 = v2.radius;
            const overlap = r1 + r2 - dist;
            
            if (overlap <= 0) return null;
            
            // Сфера первого вихря
            const mat1 = new THREE.MeshPhongMaterial({
                color: v1.groupColor, emissive: 0x112233,
                transparent: true, opacity: 0.3,
                side: THREE.DoubleSide, shininess: 60
            });
            const s1 = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat1);
            s1.scale.set(r1, r1, r1);
            s1.position.copy(v1.groupObj.position);
            group.add(s1);
            
            // Сфера второго вихря
            const mat2 = new THREE.MeshPhongMaterial({
                color: v2.groupColor, emissive: 0x112233,
                transparent: true, opacity: 0.3,
                side: THREE.DoubleSide, shininess: 60
            });
            const s2 = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat2);
            s2.scale.set(r2, r2, r2);
            s2.position.copy(v2.groupObj.position);
            group.add(s2);
            
            // Перемычка между ними (цилиндр в зоне перекрытия)
            const midPoint = new THREE.Vector3().addVectors(v1.groupObj.position, v2.groupObj.position).multiplyScalar(0.5);
            const direction = new THREE.Vector3().subVectors(v2.groupObj.position, v1.groupObj.position).normalize();
            const bridgeRadius = Math.min(r1, r2) * 0.5;
            const bridgeLength = overlap;
            
            const bridgeGeom = new THREE.CylinderGeometry(bridgeRadius, bridgeRadius, bridgeLength, 8);
            const bridgeMat = new THREE.MeshPhongMaterial({
                color: 0x88aacc, emissive: 0x112233,
                transparent: true, opacity: 0.4,
                side: THREE.DoubleSide, shininess: 60
            });
            const bridge = new THREE.Mesh(bridgeGeom, bridgeMat);
            bridge.position.copy(midPoint);
            
            // Ориентация цилиндра
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            bridge.setRotationFromQuaternion(quaternion);
            
            group.add(bridge);
            group.name = 'dumbbell';
            return group;
        }
        
        function createField() {
            const count = 600;
            const positions = [];
            for (let i = 0; i < count; i++) {
                const r = 7 + Math.random() * 14;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(r * Math.sin(phi) * Math.cos(theta));
                positions.push(r * Math.sin(phi) * Math.sin(theta) * 0.5);
                positions.push(r * Math.cos(phi));
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            const material = new THREE.PointsMaterial({ color: 0x4488ff, size: 0.08, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending });
            return new THREE.Points(geom, material);
        }
        
        // ИСПРАВЛЕНО №2,5: связи цветом группы, условие dist <= r1+r2
        function buildFlowLines() {
            while(flowLinesGroup.children.length) {
                const child = flowLinesGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
                flowLinesGroup.remove(child);
            }
            if (!showFlowLines) return;
            
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i+1; j < vortices.length; j++) {
                    const p1 = vortices[i].groupObj.position;
                    const p2 = vortices[j].groupObj.position;
                    const dist = p1.distanceTo(p2);
                    const r1 = vortices[i].radius;
                    const r2 = vortices[j].radius;
                    
                    // Связь при касании или перекрытии
                    if (dist <= r1 + r2 + 0.01) {
                        const geom = new THREE.BufferGeometry().setFromPoints([p1.clone(), p2.clone()]);
                        // Цвет — средний между цветами групп
                        const mixedColor = new THREE.Color().copy(vortices[i].groupColor).add(vortices[j].groupColor).multiplyScalar(0.5);
                        const mat = new THREE.LineBasicMaterial({ color: mixedColor, transparent: true, opacity: 0.8 });
                        flowLinesGroup.add(new THREE.Line(geom, mat));
                    }
                }
            }
        }
        
        // ИСПРАВЛЕНО №6: гантели коконов
        function buildDumbbells() {
            // Удаляем старые гантели (они в interfaceGroup)
            const toRemove = [];
            interfaceGroup.children.forEach(child => {
                if (child.name === 'dumbbell') toRemove.push(child);
            });
            toRemove.forEach(child => {
                child.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
                interfaceGroup.remove(child);
            });
            
            if (!showCocoon || analysisMode) return;
            
            const processed = new Set();
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i+1; j < vortices.length; j++) {
                    const key = `${Math.min(i,j)}_${Math.max(i,j)}`;
                    if (processed.has(key)) continue;
                    
                    const dist = vortices[i].groupObj.position.distanceTo(vortices[j].groupObj.position);
                    const r1 = vortices[i].radius;
                    const r2 = vortices[j].radius;
                    
                    if (dist < r1 + r2) {
                        const dumbbell = createDumbbellCocoon(vortices[i], vortices[j]);
                        if (dumbbell) {
                            interfaceGroup.add(dumbbell);
                            processed.add(key);
                        }
                    }
                }
            }
        }
        
        function buildTrails() {
            while(trailsGroup.children.length) {
                const child = trailsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
                trailsGroup.remove(child);
            }
            if (!showTrails || positionHistory.length < 2) return;
            
            for (let atomIdx = 0; atomIdx < vortices.length; atomIdx++) {
                const points = [];
                for (let t = Math.max(0, positionHistory.length - TRAIL_LENGTH); t < positionHistory.length; t++) {
                    if (positionHistory[t] && positionHistory[t][atomIdx]) {
                        points.push(new THREE.Vector3(positionHistory[t][atomIdx].x, positionHistory[t][atomIdx].y, positionHistory[t][atomIdx].z));
                    }
                }
                if (points.length >= 2) {
                    const geom = new THREE.BufferGeometry().setFromPoints(points);
                    const color = vortices[atomIdx].groupColor || getGroupColor(vortices[atomIdx].group);
                    const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
                    trailsGroup.add(new THREE.Line(geom, mat));
                }
            }
        }
        
        function getSystemCenter(frame) {
            let sumX = 0, sumY = 0, sumZ = 0, count = 0;
            for (let g = 1; g <= 7; g++) {
                if (frame.groups && frame.groups[g]) {
                    frame.groups[g].forEach(pos => { 
                        const p = Array.isArray(pos) ? pos : pos.pos;
                        sumX += p[0]; sumY += p[1]; sumZ += p[2]; count++; 
                    });
                }
            }
            if (count === 0) return { x: 0, y: 0, z: 0 };
            return { x: sumX/count, y: sumY/count, z: sumZ/count };
        }
        
        function clearAllLabels() {
            const domElements = labelRenderer.domElement.querySelectorAll('div');
            domElements.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
        }
        
        function buildFromFrame(frame) {
            while(vortexGroup.children.length) {
                const child = vortexGroup.children[0];
                child.traverse(c => {
                    if (c.geometry && c !== child) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
                vortexGroup.remove(child);
            }
            clearAllLabels();
            
            while(interfaceGroup.children.length) {
                const child = interfaceGroup.children[0];
                child.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
                interfaceGroup.remove(child);
            }
            vortices = [];
            
            while(highlightGroup.children.length) {
                const child = highlightGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
                highlightGroup.remove(child);
            }
            while(trailsGroup.children.length) {
                const child = trailsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
                trailsGroup.remove(child);
            }
            selectedForMeasure = [];
            positionHistory = [];
            
            if (!fieldParticles) {
                fieldParticles = createField();
                fieldGroup.add(fieldParticles);
            }
            fieldParticles.visible = showField && !analysisMode;
            
            const center = getSystemCenter(frame);
            fieldGroup.position.set(-center.x, -center.y, -center.z);
            
            let counter = 0;
            for (let g = 1; g <= 7; g++) {
                if (!frame.groups || !frame.groups[g]) continue;
                frame.groups[g].forEach(pos => {
                    const p = Array.isArray(pos) ? pos : pos.pos;
                    const tau = (pos.tau !== undefined) ? pos.tau : ((frame.tau_map && frame.tau_map[counter] !== undefined) ? frame.tau_map[counter] : 0);
                    const [x, y, z] = p;
                    const sym = pos.symbol || (frame.symbols ? frame.symbols[counter] : null);
                    const rad = pos.radius || groupRadii[g] * 0.5;
                    
                    const vortex = createVortex(x, y, z, g, tau, counter, sym, rad);
                    vortexGroup.add(vortex.groupObj);
                    
                    // Одиночный кокон того же радиуса
                    let cocoon = null;
                    if (showCocoon && !analysisMode) { 
                        cocoon = createCocoon(x, y, z, rad, g); 
                        interfaceGroup.add(cocoon); 
                    }
                    vortices.push({ ...vortex, cocoon });
                    counter++;
                });
            }
            interfaceGroup.visible = showCocoon && !analysisMode;
            buildFlowLines();
            buildDumbbells();
            updateDynamics();
        }
        
        function calculateEnergy() {
            if (vortices.length < 2) return 0.5;
            let pairEnergy = 0;
            let pairCount = 0;
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i+1; j < vortices.length; j++) {
                    const p1 = vortices[i].groupObj.position;
                    const p2 = vortices[j].groupObj.position;
                    const dist = p1.distanceTo(p2);
                    if (dist > 0.01) {
                        pairEnergy += (vortices[i].tau * vortices[j].tau) / dist;
                        pairCount++;
                    }
                }
            }
            const baseEnergy = pairCount > 0 ? pairEnergy / pairCount : 0.5;
            const envFactor = (temperature / 500) * pressure * externalField * (1 - purity * 0.2);
            return Math.min(1.5, Math.max(0.1, baseEnergy + envFactor * 0.3));
        }
        
        // ИСПРАВЛЕНО №8: автофокус камеры при загрузке
        function autoFocusCamera() {
            if (!vortices.length) return;
            let cx = 0, cy = 0, cz = 0;
            vortices.forEach(v => { cx += v.x; cy += v.y; cz += v.z; });
            cx /= vortices.length; cy /= vortices.length; cz /= vortices.length;
            
            let maxDist = 0;
            vortices.forEach(v => {
                const d = Math.hypot(v.x - cx, v.y - cy, v.z - cz);
                if (d > maxDist) maxDist = d;
            });
            
            const dist = Math.max(maxDist * 2.5, 10);
            camera.position.set(cx + dist * 0.6, cy + dist * 0.5, cz + dist * 0.7);
            controls.target.set(cx, cy, cz);
            controls.update();
        }
        
        function loadFrame(frameIdx) {
            if (!trajectoryData.length || frameIdx >= trajectoryData.length) return;
            const frame = trajectoryData[frameIdx];
            currentFrame = frameIdx;
            document.getElementById('frameSlider').value = frameIdx;
            document.getElementById('frameInput').value = frameIdx;
            document.getElementById('frameLabel').textContent = frameIdx;
            document.getElementById('totalFrames').textContent = trajectoryData.length-1;
            
            let idx = 0;
            const currentPositions = [];
            for (let g = 1; g <= 7; g++) {
                if (!frame.groups || !frame.groups[g]) continue;
                frame.groups[g].forEach(pos => {
                    if (idx < vortices.length) {
                        const p = Array.isArray(pos) ? pos : pos.pos;
                        const [x, y, z] = p;
                        vortices[idx].groupObj.position.set(x, y, z);
                        vortices[idx].x = x; vortices[idx].y = y; vortices[idx].z = z;
                        if (vortices[idx].cocoon) vortices[idx].cocoon.position.set(x, y, z);
                        currentPositions.push({x, y, z});
                    }
                    idx++;
                });
            }
            positionHistory.push(currentPositions);
            if (positionHistory.length > TRAIL_LENGTH * 2) positionHistory.shift();
            
            buildFlowLines();
            buildDumbbells();
            buildTrails();
            updateDynamics();
        }
        
        function exportCSV() {
            if (!vortices.length) return;
            let csv = 'index,group,tau,x,y,z,radius,energy\n';
            vortices.forEach((v, i) => {
                csv += `${i},${v.group},${v.tau},${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)},${v.radius.toFixed(3)},${cocoonEnergyVal.toFixed(4)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `spectravortex_frame${currentFrame}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function updateDynamics() {
            if (!vortices.length) return;
            cocoonEnergyVal = calculateEnergy();
            fieldRadiationVal = Math.min(1.2, cocoonEnergyVal * 0.8 + Math.sin(time * 1.2) * 0.1);
            
            const opacity = parseFloat(document.getElementById('opacitySlider').value);
            const brightness = parseFloat(document.getElementById('brightnessSlider').value);
            mainLight.intensity = 1.0 * brightness;
            ambientLight.intensity = 0.7 * brightness;
            
            vortices.forEach(v => {
                if (v.filament && showTau) {
                    v.filament.material.emissiveIntensity = 0.5 + cocoonEnergyVal * 0.9;
                    v.filament.material.color = getTauColor(v.tau);
                }
                if (v.cocoon && v.cocoon.material) {
                    v.cocoon.material.opacity = opacity + cocoonEnergyVal * 0.25;
                    v.cocoon.material.emissiveIntensity = 0.15 + fieldRadiationVal * 0.5;
                }
            });
            if (fieldParticles) fieldParticles.material.opacity = 0.25 + fieldRadiationVal * 0.4;
        }
        
        // ИСПРАВЛЕНО №3: измеритель с энергией в панели
        function highlightSelected() {
            while(highlightGroup.children.length) {
                const child = highlightGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
                highlightGroup.remove(child);
            }
            if (selectedForMeasure.length === 0) return;
            selectedForMeasure.forEach(v => {
                const ringGeom = new THREE.TorusGeometry(v.radius * 0.8, 0.06, 8, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x44ffaa, transparent: true, opacity: 0.9 });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.position.copy(v.groupObj.position);
                highlightGroup.add(ring);
            });
            if (selectedForMeasure.length === 2) {
                const p1 = selectedForMeasure[0].groupObj.position;
                const p2 = selectedForMeasure[1].groupObj.position;
                const lineGeom = new THREE.BufferGeometry().setFromPoints([p1.clone(), p2.clone()]);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x44ffaa, transparent: true, opacity: 0.8 });
                highlightGroup.add(new THREE.Line(lineGeom, lineMat));
            }
        }
        
        function showMeasurement(atom1, atom2, frameIdx) {
            const dCenter = Math.hypot(atom1.x-atom2.x, atom1.y-atom2.y, atom1.z-atom2.z);
            const r1 = atom1.radius;
            const r2 = atom2.radius;
            const dShell = dCenter - r1 - r2;
            const overlap = dShell < 0 ? Math.abs(dShell).toFixed(3) : null;
            const tauSum = atom1.tau + atom2.tau;
            const sym1 = atom1.label.element.textContent;
            const sym2 = atom2.label.element.textContent;
            const energy = cocoonEnergyVal.toFixed(3);
            
            document.getElementById('measureContent').innerHTML = `
                <div>🔘 ${sym1} (τ=${atom1.tau}, R=${r1.toFixed(2)}) — гр.${atom1.group}</div>
                <div>🔘 ${sym2} (τ=${atom2.tau}, R=${r2.toFixed(2)}) — гр.${atom2.group}</div>
                <div style="margin:6px 0; border-top:1px solid #333;"></div>
                <div>📏 Центр→Центр: <span style="color:#44ffaa;">${dCenter.toFixed(3)}</span></div>
                <div>🔘 Оболочка→Оболочка: <span style="color:#44ffaa;">${dShell.toFixed(3)}</span> ${overlap ? `<span style="color:#ff6666;">[ПЕРЕКРЫТИЕ ${overlap}]</span>` : ''}</div>
                <div>⚡ Στ: ${tauSum} ${tauSum === 0 ? '✅' : '⚠️'}</div>
                <div>💚 Энергия системы: <span style="color:#ffaa44;">${energy}</span></div>
                <div>📊 Кадр: ${frameIdx}</div>
            `;
            measurePanel.style.display = 'block';
            highlightSelected();
        }
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (event) => {
            if (!vortices.length || !analysisMode) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const clickable = [];
            vortices.forEach(v => {
                clickable.push(v.core);
                if (v.cocoon) clickable.push(v.cocoon);
            });
            
            const intersects = raycaster.intersectObjects(clickable);
            if (intersects.length) {
                const hit = intersects[0].object;
                let vortex = null;
                for (const v of vortices) {
                    if (v.core === hit || v.cocoon === hit || v.groupObj === hit || v.groupObj.children.includes(hit)) {
                        vortex = v; break;
                    }
                }
                if (!vortex) {
                    for (const v of vortices) {
                        if (v.cocoon && v.cocoon === hit) { vortex = v; break; }
                    }
                }
                
                if (vortex) {
                    if (measureResetTimeout) clearTimeout(measureResetTimeout);
                    selectedForMeasure.push(vortex);
                    if (selectedForMeasure.length === 2) {
                        showMeasurement(selectedForMeasure[0], selectedForMeasure[1], currentFrame);
                        selectedForMeasure = [];
                    } else {
                        measurePanel.style.display = 'block';
                        document.getElementById('measureContent').innerHTML = `Выбран: ${vortex.label.element.textContent} (τ=${vortex.tau}, R=${vortex.radius.toFixed(2)})<br>Кликните второй атом`;
                        highlightSelected();
                        measureResetTimeout = setTimeout(() => {
                            selectedForMeasure = [];
                            highlightSelected();
                            document.getElementById('measureContent').innerHTML = 'Выберите два атома кликами (Esc — сброс)';
                        }, 5000);
                    }
                }
            } else {
                selectedForMeasure = [];
                highlightSelected();
                if (measureResetTimeout) clearTimeout(measureResetTimeout);
                document.getElementById('measureContent').innerHTML = 'Выберите два атома кликами (Esc — сброс)';
            }
        });

        document.getElementById('fieldSlider').addEventListener('input', updateSliders);
        document.getElementById('puritySlider').addEventListener('input', updateSliders);
        document.getElementById('opacitySlider').addEventListener('input', debouncedUpdate);
        document.getElementById('brightnessSlider').addEventListener('input', debouncedUpdate);
        
        // ============ РЕЖИМ ОБУЧЕНИЯ ============
        let currentTooltip = null;
        const tooltipsData = {
            cocoon: { title: "🌀 КОКОН", formula: "R_кокона = R_ядра", desc: "Обменная сущность. Граница вихря. При связи — гантель." },
            core: { title: "🌑 ЯДРО", formula: "τ = ∮∇ψ·dl / 2π", desc: "Топологический скелет. Радиус и символ — из данных JSON." },
            field: { title: "✨ ПОЛЕ", formula: "∇⁴ψ = 0", desc: "Конденсатный фон. Пространство-время как сверхтекучая среда." },
            flowline: { title: "🔗 СВЯЗЬ", formula: "d ≤ R₁ + R₂", desc: "Линии тока при касании/перекрытии оболочек." },
            trail: { title: "🐾 ТРАЕКТОРИЯ", formula: "10 кадров", desc: "Хвост позиций вихря. Цвет = цвет группы." }
        };
        function showTooltip(type, x, y) {
            if (!learnMode || analysisMode) return;
            if (currentTooltip) currentTooltip.remove();
            const data = tooltipsData[type];
            if (!data) return;
            const div = document.createElement('div');
            div.className = 'learn-tooltip';
            div.style.left = (x + 15) + 'px';
            div.style.top = (y + 15) + 'px';
            div.innerHTML = `<div class="tt-title">${data.title}</div><div class="tt-formula">📐 ${data.formula}</div><div class="tt-desc">💡 ${data.desc}</div>`;
            document.body.appendChild(div);
            currentTooltip = div;
            setTimeout(() => { if (currentTooltip === div) { div.remove(); currentTooltip = null; } }, 6000);
        }
        document.getElementById('learnModeBtn').addEventListener('click', () => {
            learnMode = !learnMode;
            document.getElementById('learnModeBtn').textContent = learnMode ? '📚 Обучение: Вкл' : '📚 Обучение';
            document.getElementById('learnModeBtn').classList.toggle('learn-active', learnMode);
        });
        
        renderer.domElement.addEventListener('mousemove', (event) => {
            if (!learnMode || analysisMode) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(
                interfaceGroup.children.concat(flowLinesGroup.children, trailsGroup.children, vortexGroup.children)
            );
            if (intersects.length) {
                let type = 'core';
                if (interfaceGroup.children.includes(intersects[0].object)) type = 'cocoon';
                else if (flowLinesGroup.children.includes(intersects[0].object)) type = 'flowline';
                else if (trailsGroup.children.includes(intersects[0].object)) type = 'trail';
                showTooltip(type, event.clientX, event.clientY);
            }
        });
        
        // ============ ДЕМО-СЦЕНА ============
        const embeddedDemo = [
            {
                "step": 0, "groups": {
                    "1": [{"pos":[0,0,0],"tau":1,"symbol":"H","radius":0.55}, {"pos":[2.5,1,0.5],"tau":-1,"symbol":"H","radius":0.55}],
                    "2": [{"pos":[-2,-1,1],"tau":1,"symbol":"He","radius":0.75}, {"pos":[1.5,-1.5,0],"tau":-1,"symbol":"He","radius":0.75}],
                    "3": [{"pos":[0,2,-1.5],"tau":1,"symbol":"Li","radius":0.95}, {"pos":[-1.5,0,1.5],"tau":-1,"symbol":"Li","radius":0.95}, {"pos":[1.8,1.2,1.2],"tau":1,"symbol":"Be","radius":1.15}],
                    "4": [{"pos":[-1.5,-1.5,-1.5],"tau":-1,"symbol":"B","radius":1.15}, {"pos":[2,-2,0],"tau":1,"symbol":"C","radius":1.35}],
                    "5": [{"pos":[-2.5,2,-1],"tau":-1,"symbol":"N","radius":1.35}, {"pos":[1,-2.5,2],"tau":1,"symbol":"O","radius":1.55}],
                    "6": [{"pos":[3,0,0],"tau":1,"symbol":"F","radius":1.55}, {"pos":[-3,0,0],"tau":-1,"symbol":"Ne","radius":1.75}],
                    "7": [{"pos":[0,-3,0],"tau":-1,"symbol":"Na","radius":1.75}, {"pos":[0,0,3],"tau":1,"symbol":"Mg","radius":1.75}]
                }
            },
            {
                "step": 1, "groups": {
                    "1": [{"pos":[0.1,0.05,0.02],"tau":1,"symbol":"H","radius":0.55}, {"pos":[2.4,1.1,0.4],"tau":-1,"symbol":"H","radius":0.55}],
                    "2": [{"pos":[-1.9,-0.9,1.1],"tau":1,"symbol":"He","radius":0.75}, {"pos":[1.6,-1.4,0.1],"tau":-1,"symbol":"He","radius":0.75}],
                    "3": [{"pos":[0.1,2.1,-1.4],"tau":1,"symbol":"Li","radius":0.95}, {"pos":[-1.4,0.1,1.6],"tau":-1,"symbol":"Li","radius":0.95}, {"pos":[1.9,1.3,1.1],"tau":1,"symbol":"Be","radius":1.15}],
                    "4": [{"pos":[-1.4,-1.4,-1.4],"tau":-1,"symbol":"B","radius":1.15}, {"pos":[2.1,-1.9,0.1],"tau":1,"symbol":"C","radius":1.35}],
                    "5": [{"pos":[-2.4,2.1,-0.9],"tau":-1,"symbol":"N","radius":1.35}, {"pos":[1.1,-2.4,2.1],"tau":1,"symbol":"O","radius":1.55}],
                    "6": [{"pos":[3.1,0.1,0.1],"tau":1,"symbol":"F","radius":1.55}, {"pos":[-2.9,0.1,0.1],"tau":-1,"symbol":"Ne","radius":1.75}],
                    "7": [{"pos":[0.1,-2.9,0.1],"tau":-1,"symbol":"Na","radius":1.75}, {"pos":[0.1,0.1,3.1],"tau":1,"symbol":"Mg","radius":1.75}]
                }
            },
            {
                "step": 2, "groups": {
                    "1": [{"pos":[0.2,0.1,0.04],"tau":1,"symbol":"H","radius":0.55}, {"pos":[2.3,1.2,0.3],"tau":-1,"symbol":"H","radius":0.55}],
                    "2": [{"pos":[-1.8,-0.8,1.2],"tau":1,"symbol":"He","radius":0.75}, {"pos":[1.7,-1.3,0.2],"tau":-1,"symbol":"He","radius":0.75}],
                    "3": [{"pos":[0.2,2.2,-1.3],"tau":1,"symbol":"Li","radius":0.95}, {"pos":[-1.3,0.2,1.7],"tau":-1,"symbol":"Li","radius":0.95}, {"pos":[2.0,1.4,1.0],"tau":1,"symbol":"Be","radius":1.15}],
                    "4": [{"pos":[-1.3,-1.3,-1.3],"tau":-1,"symbol":"B","radius":1.15}, {"pos":[2.2,-1.8,0.2],"tau":1,"symbol":"C","radius":1.35}],
                    "5": [{"pos":[-2.3,2.2,-0.8],"tau":-1,"symbol":"N","radius":1.35}, {"pos":[1.2,-2.3,2.2],"tau":1,"symbol":"O","radius":1.55}],
                    "6": [{"pos":[3.2,0.2,0.2],"tau":1,"symbol":"F","radius":1.55}, {"pos":[-2.8,0.2,0.2],"tau":-1,"symbol":"Ne","radius":1.75}],
                    "7": [{"pos":[0.2,-2.8,0.2],"tau":-1,"symbol":"Na","radius":1.75}, {"pos":[0.2,0.2,3.2],"tau":1,"symbol":"Mg","radius":1.75}]
                }
            }
        ];
        
        trajectoryData = embeddedDemo;
        document.getElementById('frameSlider').max = trajectoryData.length - 1;
        document.getElementById('frameInput').max = trajectoryData.length - 1;
        document.getElementById('frameSlider').disabled = false;
        document.getElementById('frameInput').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('prevFrameBtn').disabled = false;
        document.getElementById('nextFrameBtn').disabled = false;
        document.getElementById('exportCsvBtn').disabled = false;
        document.getElementById('toggleTrailsBtn').disabled = false;
        buildFromFrame(trajectoryData[0]);
        loadFrame(0);
        setTimeout(autoFocusCamera, 200);
        
        // ============ АНИМАЦИЯ ============
        function animate(timestamp) {
            requestAnimationFrame(animate);
            time += 0.016;
            
            if (playing && trajectoryData.length > 1) {
                if (timestamp - lastFrameTime >= FRAME_INTERVAL) {
                    loadFrame((currentFrame + 1) % trajectoryData.length);
                    lastFrameTime = timestamp;
                }
            }
            
            updateDynamics();
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
        
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            perspCamera.aspect = aspect;
            perspCamera.updateProjectionMatrix();
            orthoCamera.left = -10 * aspect;
            orthoCamera.right = 10 * aspect;
            orthoCamera.top = 10;
            orthoCamera.bottom = -10;
            orthoCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
