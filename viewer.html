<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SpectraVortex v3.9.6 — ВММП. Из первых принципов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; }
        
        #controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
            padding: 8px 12px; border-radius: 12px;
            display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
            z-index: 100; border-top: 1px solid #333;
            font-size: 9px; max-height: 45vh; overflow-y: auto;
        }
        button {
            background: #1a1a2e; color: #0ff; border: 1px solid #0ff;
            padding: 4px 8px; cursor: pointer; font-family: monospace;
            font-size: 9px; transition: all 0.2s; border-radius: 6px;
            white-space: nowrap;
        }
        button:hover { background: #0ff; color: #000; }
        button.active { background: #ff3366; border-color: #ff3366; color: #fff; }
        button.learn-active { background: #44aa44; border-color: #44ffaa; color: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; background: #111; color: #555; border-color: #333; }
        
        .slider-container { display: flex; align-items: center; gap: 4px; background: #111; padding: 2px 6px; border-radius: 16px; }
        input[type="range"] { width: 60px; height: 3px; accent-color: #ffaa44; }
        input[type="number"] {
            width: 45px; background: #111; color: #0ff; border: 1px solid #333;
            padding: 2px 4px; font-family: monospace; font-size: 10px; border-radius: 4px;
        }
        
        .error-hunter {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 5px 10px;
            display: flex; gap: 8px; flex-wrap: wrap;
            z-index: 100; border-left: 3px solid #ff3366;
            font-size: 8px;
        }
        .param-group { display: flex; gap: 3px; align-items: center; }
        .param-group span:first-child { min-width: 35px; }
        
        .measure-panel {
            position: absolute; bottom: 100px; right: 15px;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 10px 14px;
            border-right: 3px solid #44ffaa;
            font-family: monospace; font-size: 9px;
            z-index: 100; min-width: 280px; max-width: 360px;
            display: none; max-height: 65vh; overflow-y: auto;
        }
        .measure-panel .title { color: #44ffaa; margin-bottom: 6px; font-size: 10px; }
        .measure-panel .close-btn { float: right; cursor: pointer; color: #ff6666; margin-left: 8px; }
        .measure-panel .copy-btn { float: right; cursor: pointer; color: #ffaa44; margin-left: 5px; font-size: 12px; }
        
        .legend {
            position: absolute; bottom: 90px; left: 15px;
            background: rgba(0,0,0,0.7); padding: 3px 8px;
            border-radius: 8px; font-size: 7px; color: #bbb;
            pointer-events: none; max-width: 90vw;
        }
        
        .learn-tooltip {
            position: fixed;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(12px);
            border-left: 3px solid #44ffaa;
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 260px;
            z-index: 10000;
            font-family: monospace;
            font-size: 10px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .learn-tooltip .tt-title { color: #44ffaa; font-size: 11px; margin-bottom: 4px; }
        .learn-tooltip .tt-formula { color: #ffaa44; font-size: 9px; margin-bottom: 5px; border-top: 1px solid #333; padding-top: 4px; }
        .learn-tooltip .tt-desc { color: #ccc; line-height: 1.3; }
        
        .info-banner {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 5px 12px; border-radius: 10px;
            font-family: monospace; font-size: 9px; z-index: 100;
            border-left: 3px solid #ffaa44;
            color: #ffaa44; max-width: 280px;
        }
        
        .mode-banner {
            position: absolute; top: 70px; left: 15px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 5px 12px; border-radius: 10px;
            font-family: monospace; font-size: 9px; z-index: 100;
        }
        .mode-banner.demo { border-left: 3px solid #44ffaa; color: #44ffaa; }
        .mode-banner.analysis { border-left: 3px solid #ffaa44; color: #ffaa44; }
        
        /* Добавлен слайдер кадров */
        .frame-slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            padding: 2px 8px;
            border-radius: 16px;
        }
        .frame-slider-container input {
            width: 150px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="loadBtn">📂 JSON</button>
        <button id="playBtn" disabled>▶</button>
        <button id="prevFrameBtn" disabled>◀</button>
        <input type="number" id="frameInput" value="0" min="0" max="0" disabled style="width:50px;">
        <button id="nextFrameBtn" disabled>▶</button>
        <div class="frame-slider-container">
            <span>🎞️</span>
            <input type="range" id="frameSlider" min="0" max="0" step="1" disabled style="width:150px;">
        </div>
        <button id="resetViewBtn">🎥 Сброс</button>
        <button id="toggleProjectionBtn">📐 Перспектива</button>
        <button id="toggleModeBtn" class="active">📚 Демо</button>
        <button id="toggleCocoonBtn" class="active">🌀 Коконы</button>
        <button id="toggleFieldBtn" class="active">🌊 Поле</button>
        <button id="toggleTauBtn">⚡ τ-жилы</button>
        <button id="toggleFlowBtn" class="active">🔗 Связи</button>
        <button id="toggleTrailsBtn" disabled>🐾 Траектории</button>
        <button id="learnModeBtn">📚 Обучение</button>
        <div class="slider-container"><span>🌀 Прозр.</span><input type="range" id="opacitySlider" min="0.05" max="0.8" step="0.01" value="0.3"></div>
        <div class="slider-container"><span>💡 Ярк.</span><input type="range" id="brightnessSlider" min="0.3" max="1.5" step="0.01" value="0.9"></div>
        <input type="file" id="fileInput" accept=".json" style="display:none;">
        <button id="exportCsvBtn" disabled>📥 CSV</button>
    </div>

    <div class="mode-banner demo" id="modeBanner">📚 ДЕМО: Вихревая Модель Материи-Пространства</div>
    <div class="info-banner" id="infoBanner">
        📊 Кадр <span id="frameLabel">0</span>/<span id="totalFrames">0</span>
        | d_min: <span id="dminVal">—</span>
        | E_vortex: <span id="energyVal">—</span>
        | Δ: <span id="deltaVal">—</span>
    </div>

    <div class="error-hunter" id="errorHunter">
        <div class="param-group" title="Температура среды. Определяет d_env — равновесное межвихревое расстояние.">🌡️ T:<input type="range" id="tempSlider" min="10" max="2000" value="300" step="10"><span id="tempVal">300K</span></div>
        <div class="param-group" title="Внешнее давление. Меняет d_env.">💥 P:<input type="range" id="pressureSlider" min="0.1" max="10" value="1" step="0.1"><span id="pressureVal">1.0</span></div>
        <div class="param-group" title="Напряжённость внешнего поля H. Сдвигает d_env.">⚡ H:<input type="range" id="fieldSlider" min="0" max="1.5" value="0.5" step="0.01"><span id="fieldVal">0.50</span></div>
        <div class="param-group" title="Чистота: 1 = без дефектов. <0.3 — критический риск.">🧪 χ:<input type="range" id="puritySlider" min="0" max="1" value="0.9" step="0.01"><span id="purityVal">0.90</span></div>
    </div>

    <div class="measure-panel" id="measurePanel">
        <div class="title">📏 ИЗМЕРИТЕЛЬ ВММП <span class="copy-btn" id="copyMeasureBtn" title="Копировать">📋</span><span class="close-btn" id="closeMeasureBtn">✕</span></div>
        <div id="measureContent">Выберите два атома кликами (Esc — сброс)</div>
    </div>

    <div class="legend" id="legend">🌑 Ядро | 🌀 Кокон | ✨ Поле H | 🔗 Связи (ступеньки совпали) | ⚡ τ-жилы | 📚 Обучение: наведи</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // ============ КОНСТАНТЫ ВММП ============
        const VMMP = {
            d_opt_default: {1:0.74, 2:1.22, 3:1.52, 4:1.82, 5:2.05, 6:2.20, 7:2.40},
            d_env_base: 2.10,
            temp_coef: 0.0003,
            press_coef: -0.05,
            field_coef: 0.15,
            purity_coef: 0.08,
        };

        // ============ СЦЕНА ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        scene.fog = new THREE.FogExp2(0x030318, 0.0015);
        
        const aspect = window.innerWidth / window.innerHeight;
        const perspCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 500);
        perspCamera.position.set(8, 6, 12);
        const orthoCamera = new THREE.OrthographicCamera(-10*aspect, 10*aspect, 10, -10, 0.1, 500);
        orthoCamera.position.copy(perspCamera.position);
        
        let camera = perspCamera;
        let isOrthographic = false;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.zoomSpeed = 1.1;
        
        scene.add(new THREE.AmbientLight(0x404060, 0.7));
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.1);
        mainLight.position.set(8, 15, 5);
        scene.add(mainLight);
        scene.add(new THREE.PointLight(0x4488ff, 0.4, 30, 1));
        
        const vortexGroup = new THREE.Group();
        const interfaceGroup = new THREE.Group();
        const fieldGroup = new THREE.Group();
        const flowLinesGroup = new THREE.Group();
        const highlightGroup = new THREE.Group();
        const trailsGroup = new THREE.Group();
        scene.add(vortexGroup, interfaceGroup, fieldGroup, flowLinesGroup, highlightGroup, trailsGroup);
        
        // ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
        let trajectoryData = [];
        let currentFrame = 0, playing = false, lastFrameTime = 0;
        const FRAME_INTERVAL = 120;
        let time = 0, pulsePhase = 0;
        let updateTimeout = null, measureResetTimeout = null;
        
        let vortices = [], fieldParticles = null;
        let selectedForMeasure = [], positionHistory = [];
        const TRAIL_LENGTH = 10;
        
        let analysisMode = false, showCocoon = true, showField = true;
        let showTau = true, showFlowLines = true, showTrails = false, learnMode = false;
        
        let temperature = 300, pressure = 1.0, externalField = 0.5, purity = 0.9;
        let dminForFrame = null, energyVortex = 0, deltaTopo = 0, d_env = 0;
        
        const groupColors = ['#ff3366', '#ff8844', '#ffdd44', '#44cc44', '#44aaff', '#aa66ff', '#ff66cc'];
        const groupRadii = {1:0.55, 2:0.75, 3:0.95, 4:1.15, 5:1.35, 6:1.55, 7:1.75};
        let tauWarnings = [];
        
        function getGroupColor(g) { return new THREE.Color(groupColors[(g-1)%7]); }
        
        function getTauColor(tau) {
            if (!Number.isInteger(tau)) console.warn(`τ = ${tau} не целое`);
            const hue = 0.55 + (tau || 0) * 0.1;
            return new THREE.Color().setHSL(Math.min(0.85, Math.max(0.25, hue)), 1.0, 0.65);
        }
        
        function debouncedUpdate() {
            if (updateTimeout) clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => updateDynamics(), 30);
        }
        
        function setProjection(ortho) {
            if (ortho === isOrthographic) return;
            isOrthographic = ortho;
            const pos = camera.position.clone(), tgt = controls.target.clone();
            camera = ortho ? orthoCamera : perspCamera;
            camera.position.copy(pos);
            controls.object = camera;
            controls.target.copy(tgt);
            controls.update();
        }
        
        function calcDEnv() {
            let d = VMMP.d_env_base;
            d += VMMP.temp_coef * (temperature - 300);
            d += VMMP.press_coef * (pressure - 1.0);
            d += VMMP.field_coef * (externalField - 0.5);
            d += VMMP.purity_coef * (1.0 - purity);
            return Math.max(0.5, Math.min(5.0, d));
        }
        
        function calcDelta(vortex) {
            const dOpt = VMMP.d_opt_default[vortex.group] || 2.0;
            return Math.abs(dOpt - d_env) / d_env;
        }
        
        function calcEnergyVortex() {
            if (vortices.length < 2) return 0;
            let totalEnergy = 0;
            let pairCount = 0;
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i + 1; j < vortices.length; j++) {
                    const p1 = vortices[i].groupObj.position;
                    const p2 = vortices[j].groupObj.position;
                    const dist = p1.distanceTo(p2);
                    const deltaSum = calcDelta(vortices[i]) + calcDelta(vortices[j]);
                    const distFactor = 1.0 / (1.0 + Math.exp(-(dist - d_env) * 3));
                    totalEnergy += deltaSum * distFactor * (1 + Math.abs(vortices[i].tau * vortices[j].tau) * 0.2);
                    pairCount++;
                }
            }
            return pairCount > 0 ? totalEnergy / pairCount : 0;
        }
        
        function stepsMatch(v1, v2) {
            const dist = v1.groupObj.position.distanceTo(v2.groupObj.position);
            return Math.abs(dist - d_env) / d_env < 0.15;
        }
        
        function createVortex(x, y, z, group, tau, index, customSymbol, customRadius) {
            const groupObj = new THREE.Group();
            const radius = customRadius || groupRadii[group] * 0.5;
            const groupColor = getGroupColor(group);
            
            const coreMat = new THREE.MeshStandardMaterial({
                color: groupColor, emissive: groupColor, emissiveIntensity: 0.25,
                roughness: 0.4, metalness: 0.1
            });
            const core = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), coreMat);
            core.name = 'core';
            groupObj.add(core);
            
            const filamentMat = new THREE.MeshStandardMaterial({
                color: getTauColor(tau), emissive: getTauColor(tau), emissiveIntensity: 0.6,
                roughness: 0.3, metalness: 0.2
            });
            const filament = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.12, 32, 32), filamentMat);
            filament.name = 'filament';
            filament.visible = showTau;
            groupObj.add(filament);
            
            groupObj.position.set(x, y, z);
            
            const div = document.createElement('div');
            const sym = customSymbol || ((index < 118) ? getElementSymbol(index) : (index+1).toString());
            div.textContent = sym;
            div.style.cssText = 'color:#fff;font-size:10px;font-weight:bold;font-family:monospace;text-shadow:0 0 3px #000;background:rgba(0,0,0,0.6);padding:1px 4px;border-radius:10px;border:1px solid ' + groupColors[(group-1)%7];
            const label = new THREE.CSS2DObject(div);
            label.position.set(0, radius * 1.5, 0);
            groupObj.add(label);
            
            return { groupObj, core, filament, tau, label, index, x, y, z, group, radius, groupColor };
        }
        
        function getElementSymbol(n) {
            const syms = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
            return (n >= 0 && n < syms.length) ? syms[n] : '?';
        }
        
        function createCocoon(x, y, z, radius, group) {
            const mat = new THREE.MeshPhongMaterial({
                color: getGroupColor(group), emissive: 0x112233,
                transparent: true, opacity: 0.25, side: THREE.DoubleSide,
                shininess: 50, depthWrite: false
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
            sphere.scale.setScalar(radius);
            sphere.position.set(x, y, z);
            sphere.name = 'cocoon';
            return sphere;
        }
        
        function createField() {
            const count = 500;
            const positions = [];
            for (let i = 0; i < count; i++) {
                const r = 6 + Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta) * 0.5, r * Math.cos(phi));
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            const mat = new THREE.PointsMaterial({ color: 0x4488ff, size: 0.07, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false });
            return new THREE.Points(geom, mat);
        }
        
        function buildFlowLines() {
            while(flowLinesGroup.children.length) {
                const c = flowLinesGroup.children[0];
                if(c.geometry) c.geometry.dispose();
                if(c.material) c.material.dispose();
                flowLinesGroup.remove(c);
            }
            if (!showFlowLines || vortices.length < 2) return;
            
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i+1; j < vortices.length; j++) {
                    if (!stepsMatch(vortices[i], vortices[j])) continue;
                    const p1 = vortices[i].groupObj.position.clone();
                    const p2 = vortices[j].groupObj.position.clone();
                    const dist = p1.distanceTo(p2);
                    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                    const mixedColor = new THREE.Color().copy(vortices[i].groupColor).add(vortices[j].groupColor).multiplyScalar(0.5);
                    const cylGeom = new THREE.CylinderGeometry(0.05, 0.05, dist, 8);
                    const cylMat = new THREE.MeshBasicMaterial({ color: mixedColor, transparent: true, opacity: 0.8, depthWrite: false });
                    const cyl = new THREE.Mesh(cylGeom, cylMat);
                    cyl.position.copy(mid);
                    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
                    cyl.setRotationFromQuaternion(q);
                    flowLinesGroup.add(cyl);
                }
            }
        }
        
        function buildDumbbells() {
            const toRemove = [];
            interfaceGroup.children.forEach(c => { if (c.name === 'dumbbell') toRemove.push(c); });
            toRemove.forEach(c => {
                if(c.geometry) c.geometry.dispose();
                if(c.material) c.material.dispose();
                interfaceGroup.remove(c);
            });
            if (!showCocoon || analysisMode) return;
            
            const processed = new Set();
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i+1; j < vortices.length; j++) {
                    const key = `${Math.min(i,j)}_${Math.max(i,j)}`;
                    if (processed.has(key)) continue;
                    if (!stepsMatch(vortices[i], vortices[j])) continue;
                    
                    const p1 = vortices[i].groupObj.position;
                    const p2 = vortices[j].groupObj.position;
                    const dist = p1.distanceTo(p2);
                    const r1 = vortices[i].radius;
                    const r2 = vortices[j].radius;
                    
                    if (dist < (r1 + r2) * 1.5) {
                        const group = new THREE.Group();
                        group.name = 'dumbbell';
                        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                        const bridgeLen = Math.max(0.1, dist - r1 - r2 + 0.3);
                        const bridgeGeom = new THREE.CylinderGeometry(Math.min(r1,r2)*0.4, Math.min(r1,r2)*0.4, bridgeLen, 8);
                        const bridgeMat = new THREE.MeshPhongMaterial({
                            color: 0x88aacc, emissive: 0x112233,
                            transparent: true, opacity: 0.35, depthWrite: false
                        });
                        const bridge = new THREE.Mesh(bridgeGeom, bridgeMat);
                        bridge.position.copy(mid);
                        bridge.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir));
                        group.add(bridge);
                        interfaceGroup.add(group);
                        processed.add(key);
                    }
                }
            }
        }
        
        function buildTrails() {
            while(trailsGroup.children.length) {
                const c = trailsGroup.children[0];
                if(c.geometry) c.geometry.dispose();
                if(c.material) c.material.dispose();
                trailsGroup.remove(c);
            }
            if (!showTrails || positionHistory.length < 2) return;
            for (let i = 0; i < vortices.length; i++) {
                const pts = [];
                for (let t = Math.max(0, positionHistory.length-TRAIL_LENGTH); t < positionHistory.length; t++) {
                    if (positionHistory[t] && positionHistory[t][i])
                        pts.push(new THREE.Vector3(positionHistory[t][i].x, positionHistory[t][i].y, positionHistory[t][i].z));
                }
                if (pts.length >= 2) {
                    const g = new THREE.BufferGeometry().setFromPoints(pts);
                    const m = new THREE.LineBasicMaterial({ color: vortices[i].groupColor || getGroupColor(vortices[i].group), transparent: true, opacity: 0.5, depthWrite: false });
                    trailsGroup.add(new THREE.Line(g, m));
                }
            }
        }
        
        function buildFromFrame(frame) {
            while(vortexGroup.children.length) vortexGroup.remove(vortexGroup.children[0]);
            while(interfaceGroup.children.length) interfaceGroup.remove(interfaceGroup.children[0]);
            
            vortices = [];
            selectedForMeasure = [];
            positionHistory = [];
            tauWarnings = [];
            
            while(highlightGroup.children.length) highlightGroup.remove(highlightGroup.children[0]);
            while(trailsGroup.children.length) trailsGroup.remove(trailsGroup.children[0]);
            
            if (!fieldParticles) { fieldParticles = createField(); fieldGroup.add(fieldParticles); }
            fieldParticles.visible = showField && !analysisMode;
            
            dminForFrame = frame.d_min || null;
            d_env = calcDEnv();
            
            let counter = 0;
            for (let g = 1; g <= 7; g++) {
                if (!frame.groups || !frame.groups[g]) continue;
                frame.groups[g].forEach(pos => {
                    const p = Array.isArray(pos) ? pos : pos.pos;
                    const tau = (pos.tau !== undefined) ? pos.tau : ((frame.tau_map && frame.tau_map[counter] !== undefined) ? frame.tau_map[counter] : 0);
                    const [x, y, z] = p;
                    const sym = pos.symbol || (frame.symbols ? frame.symbols[counter] : null);
                    const rad = pos.radius || groupRadii[g] * 0.5;
                    
                    const vortex = createVortex(x, y, z, g, tau, counter, sym, rad);
                    vortexGroup.add(vortex.groupObj);
                    
                    if (showCocoon && !analysisMode) {
                        const cocoon = createCocoon(x, y, z, rad, g);
                        interfaceGroup.add(cocoon);
                        vortex.cocoon = cocoon;
                    }
                    vortices.push(vortex);
                    counter++;
                });
            }
            
            interfaceGroup.visible = showCocoon && !analysisMode;
            
            energyVortex = calcEnergyVortex();
            const avgDelta = vortices.length > 0 ? vortices.reduce((s,v) => s + calcDelta(v), 0) / vortices.length : 0;
            deltaTopo = avgDelta;
            
            updateInfoBanner();
            buildFlowLines();
            buildDumbbells();
            updateDynamics();
        }
        
        function updateInfoBanner() {
            document.getElementById('frameLabel').textContent = currentFrame;
            document.getElementById('totalFrames').textContent = trajectoryData.length - 1;
            document.getElementById('dminVal').textContent = dminForFrame ? dminForFrame.toFixed(3) : '—';
            document.getElementById('energyVal').textContent = energyVortex.toFixed(3);
            document.getElementById('deltaVal').textContent = deltaTopo.toFixed(4);
        }
        
        function loadFrame(frameIdx) {
            if (!trajectoryData.length || frameIdx >= trajectoryData.length) return;
            const frame = trajectoryData[frameIdx];
            currentFrame = frameIdx;
            dminForFrame = frame.d_min || null;
            d_env = calcDEnv();
            
            document.getElementById('frameSlider').value = frameIdx;
            document.getElementById('frameInput').value = frameIdx;
            
            let idx = 0;
            const currentPositions = [];
            for (let g = 1; g <= 7; g++) {
                if (!frame.groups || !frame.groups[g]) continue;
                frame.groups[g].forEach(pos => {
                    if (idx < vortices.length) {
                        const p = Array.isArray(pos) ? pos : pos.pos;
                        const [x, y, z] = p;
                        vortices[idx].groupObj.position.set(x, y, z);
                        vortices[idx].x = x; vortices[idx].y = y; vortices[idx].z = z;
                        if (vortices[idx].cocoon) vortices[idx].cocoon.position.set(x, y, z);
                        currentPositions.push({x, y, z});
                    }
                    idx++;
                });
            }
            positionHistory.push(currentPositions);
            if (positionHistory.length > TRAIL_LENGTH * 2) positionHistory.shift();
            
            energyVortex = calcEnergyVortex();
            const avgDelta = vortices.length > 0 ? vortices.reduce((s,v) => s + calcDelta(v), 0) / vortices.length : 0;
            deltaTopo = avgDelta;
            
            updateInfoBanner();
            buildFlowLines();
            buildDumbbells();
            buildTrails();
            updateDynamics();
        }
        
        function updateDynamics() {
            if (!vortices.length) return;
            const opacity = parseFloat(document.getElementById('opacitySlider').value);
            const brightness = parseFloat(document.getElementById('brightnessSlider').value);
            mainLight.intensity = 0.9 * brightness;
            
            vortices.forEach(v => {
                if (v.filament && showTau) {
                    v.filament.material.emissiveIntensity = 0.4 + energyVortex * 0.8;
                    v.filament.material.color = getTauColor(v.tau);
                }
                if (v.cocoon && v.cocoon.material) {
                    v.cocoon.material.opacity = opacity + energyVortex * 0.2;
                }
            });
            if (fieldParticles) fieldParticles.material.opacity = 0.15 + energyVortex * 0.3;
        }

            if (!selectedForMeasure.length) return;
            
            selectedForMeasure.forEach(v => {

                const ringMat = new THREE.MeshBasicMaterial({ color: 0x44ffaa, transparent: true, opacity: 0.85, depthTest: false });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.position.copy(v.groupObj.position);
                highlightGroup.add(ring);
            });
            
            if (selectedForMeasure.length === 2) {
                const p1 = selectedForMeasure[0].groupObj.position.clone();

                const lineGeom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x44ffaa, transparent: true, opacity: 0.7, depthTest: false });
                const line = new THREE.Line(lineGeom, lineMat);

        }
        
        function showMeasurement(v1, v2, frameIdx) {
            const p1 = v1.groupObj.position, p2 = v2.groupObj.position;
            const dCenter = p1.distanceTo(p2);
            const dShell = dCenter - v1.radius - v2.radius;
            const overlap = dShell < 0;
            const tauSum = v1.tau + v2.tau;
            const delta1 = calcDelta(v1), delta2 = calcDelta(v2);
            const matchSteps = stepsMatch(v1, v2);
            
            const text = [
                `🔘 ${v1.label.element.textContent} | τ=${v1.tau} | R=${v1.radius.toFixed(2)} | гр.${v1.group} | Δ=${delta1.toFixed(3)}`,
                `   📍 (${v1.x.toFixed(3)}, ${v1.y.toFixed(3)}, ${v1.z.toFixed(3)})`,
                `🔘 ${v2.label.element.textContent} | τ=${v2.tau} | R=${v2.radius.toFixed(2)} | гр.${v2.group} | Δ=${delta2.toFixed(3)}`,
                `   📍 (${v2.x.toFixed(3)}, ${v2.y.toFixed(3)}, ${v2.z.toFixed(3)})`,
                `──────────────────────────────`,
                `📏 Центр→Центр: ${dCenter.toFixed(4)}`,
                `🔘 Обол→Обол: ${dShell.toFixed(4)} ${overlap ? '⚡ ПЕРЕКРЫТИЕ' : ''}`,
                `🎯 Совпадение ступенек: ${matchSteps ? '✅ ДА' : '❌ НЕТ'} (d_env = ${d_env.toFixed(3)})`,
                `⚡ Στ: ${tauSum} ${tauSum === 0 ? '(компенсация)' : ''}`,
                `──────────────────────────────`,
                `📊 Кадр: ${frameIdx} | d_min: ${dminForFrame ? dminForFrame.toFixed(3) : '—'}`,
                `💚 E_vortex: ${energyVortex.toFixed(4)} | Δ_сред: ${deltaTopo.toFixed(4)}`,
                `🌡️ d_env: ${d_env.toFixed(3)} (T=${temperature}K, P=${pressure.toFixed(1)})`
            ].join('\n');
            
            document.getElementById('measureContent').innerHTML = `<pre style="margin:0;white-space:pre-wrap;line-height:1.45;font-size:9px;">${text}</pre>`;
            document.getElementById('measurePanel').style.display = 'block';

            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
