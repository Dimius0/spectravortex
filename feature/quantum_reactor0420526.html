<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpectraVortex — Quantum Reactor v3.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background-color: #000;
      color: #0f0;
    }
    
    /* ЭКРАН ЗАГРУЗКИ */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #loading-screen h1 {
      font-size: 2.2em;
      margin-bottom: 0.3em;
      text-shadow: 0 0 15px #0f0;
      letter-spacing: 3px;
    }
    #loading-screen p {
      margin: 5px 0;
      color: #0a0;
    }
    #loading-screen button {
      background: transparent;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 15px 40px;
      font-size: 1.5em;
      cursor: pointer;
      margin-top: 2em;
      font-family: inherit;
      transition: all 0.3s;
    }
    #loading-screen button:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 30px #0f0;
    }
    .progress-bar {
      width: 350px;
      height: 6px;
      border: 1px solid #0a0;
      margin-top: 1.5em;
      background: #111;
    }
    .progress-fill {
      height: 100%;
      background: #0f0;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px #0f0;
    }
    
    /* ИНФО-ПАНЕЛЬ */
    #info-panel {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.75);
      padding: 12px 16px;
      border-left: 3px solid #0f0;
      z-index: 10;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.6;
    }
    
    /* КОНТРОЛЛЕР */
    #controls {
      position: absolute;
      bottom: 20px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.85);
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 10;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      box-shadow: 0 0 15px #0f0;
    }
    button:disabled {
      background: #222;
      color: #555;
      cursor: not-allowed;
    }
    input[type=range] {
      flex-grow: 1;
      cursor: pointer;
      background: #222;
      height: 5px;
      accent-color: #0f0;
      min-width: 100px;
    }
    
    /* СТАТУС */
    #status-message {
      position: absolute;
      bottom: 85px; left: 20px;
      color: #ff0;
      z-index: 10;
      font-size: 11px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
    }
    
    /* АЛХИМИЧЕСКИЙ РЕАКТОР */
    #alchemy-panel {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #ff0;
      padding: 12px;
      color: #ff0;
      z-index: 10;
      width: 260px;
      display: none;
      font-size: 12px;
    }
    #alchemy-panel h4 {
      margin: 0 0 8px 0;
      text-align: center;
    }
    #alchemy-panel select {
      width: 100%;
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px;
      margin-bottom: 6px;
      font-family: inherit;
    }
    
    /* ПЛОТНОСТЬ */
    #density-panel {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.8);
      border: 1px solid #08f;
      padding: 10px;
      color: #08f;
      z-index: 10;
      font-size: 11px;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }
    
    /* ЛЕЙБЛЫ */
    .element-label {
      color: #fff;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 5px #000;
      pointer-events: none;
      user-select: none;
    }
    
    /* СКРОЛЛБАР */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #0f0; }
  </style>
</head>
<body>

<div id="loading-screen">
  <h1>⚛ SPECTRA VORTEX</h1>
  <p>Virtual Molecular Modeling System v3.0</p>
  <p>Поле H • Плотность • Квантовые связи</p>
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <button onclick="startApp()">ИНИЦИАЛИЗИРОВАТЬ РЕАКТОР</button>
</div>

<div id="info-panel" style="display:none;">
  <b>SPECTRA VORTEX</b><br>
  Шаг: <span id="stepLabel">—</span><br>
  d_min: <span id="dminLabel">—</span><br>
  Связей: <span id="bondsLabel">—</span>
</div>

<div id="status-message"></div>

<div id="controls" style="display:none;">
  <button id="loadBtn" title="Загрузить траектории">📂 JSON</button>
  <button id="playBtn" disabled title="Воспроизведение">▶</button>
  <input type="range" id="slider" min="0" max="0" value="0" step="1" disabled title="Кадр">
  <button id="captureBtn" disabled title="Захват кадра и отчёта">📸</button>
  <button id="alchemyToggle" title="Алхимический реактор">⚗️</button>
  <button id="densityToggle" title="Плотность поля H">🔥 Поле</button>
  <input type="file" id="fileInput" accept=".json" style="display:none;">
</div>

<div id="alchemy-panel">
  <h4>⚗️ Алхимический Реактор</h4>
  <select id="el1"></select>
  <select id="el2"></select>
  <button onclick="runReactor()" style="width:100%;margin-top:6px;">СИНТЕЗИРОВАТЬ</button>
  <div id="reactorResult" style="margin-top:10px;font-size:11px;"></div>
</div>

<div id="density-panel">
  <h4 style="margin:0 0 8px 0;text-align:center;">🔥 Плотность поля H</h4>
  <div>Z-слой: <input type="range" id="densitySliceZ" min="0" max="63" value="32" style="width:100%;"></div>
  <canvas id="densityCanvas" width="128" height="128" style="width:100%;margin-top:8px;image-rendering:pixelated;"></canvas>
  <div id="densityInfo" style="margin-top:5px;font-size:10px;">Слой 32/63</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js">
</script>

<script>
  // ==================== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ====================
  let scene, camera, renderer, labelRenderer, controls;
  let trajectoryData = [];
  let currentFrame = 0;
  let playing = false;
  let groupObjects = {};
  let quantumLines = [];
  let trailLines = [];
  
  // Базы знаний
  let knownBonds = [];
  let knownIsotopes = [];
  let fieldDensity3D = null;
  let knowledgeLoaded = false;

  // ==================== КОНСТАНТЫ ====================
  const colors = ['#ff4444','#44ff44','#4488ff','#ffaa00','#ff44ff','#44ffff','#ffffff'];
  const symbols = [
    '?','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar',
    'K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr',
    'Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe',
    'Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu',
    'Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra',
    'Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr'
  ];
  const groupRadii = {1:0.4, 2:0.6, 3:0.8, 4:1.0, 5:1.2, 6:1.4, 7:1.6};
  
  // Кэш
  const pairCache = new Map();

  // ==================== БАЗЫ ЗНАНИЙ ====================
  const BASE_PATH = 'data/';
  
  async function loadKnowledgeBases() {
    const statusEl = document.getElementById('status-message');
    const progressFill = document.getElementById('progressFill');
    
    statusEl.textContent = '⏳ Загрузка баз знаний...';
    progressFill.style.width = '5%';
    
    const bases = [
      {name:'bonds', file:'field_H_intermetallides_known.json'},
      {name:'isotopes', file:'field_H_isotopes_perturbations.json'},
      {name:'density', file:'field_h_density_3d.json'}
    ];
    
    // Загружаем параллельно
    const results = await Promise.allSettled(
      bases.map(b => fetch(BASE_PATH + b.file).then(r => r.ok ? r.json() : Promise.reject(r.status)))
    );
    
    results.forEach((res, i) => {
      if (res.status === 'fulfilled') {
        const data = res.value;
        if (i === 0) knownBonds = data.bonds || [];
        else if (i === 1) knownIsotopes = data.perturbations || [];
        else if (i === 2) {
          fieldDensity3D = {
            metadata: data.metadata || {},
            data: new Float32Array(data.density_3d || []),
            getValue: function(ix, iy, iz) {
              const R = this.metadata.resolution || 64;
              if (ix<0||ix>=R||iy<0||iy>=R||iz<0||iz>=R) return 0;
              return this.data[ix + iy*R + iz*R*R] || 0;
            }
          };
        }
      } else {
        console.warn(`База ${bases[i].name}: ошибка загрузки`);
      }
      progressFill.style.width = `${5 + (i+1)*25}%`;
    });
    
    knowledgeLoaded = knownBonds.length > 0 || knownIsotopes.length > 0;
    progressFill.style.width = '85%';
    
    const hasDensity = fieldDensity3D && fieldDensity3D.data.length > 0;
    statusEl.textContent = knowledgeLoaded
      ? `✅ Базы: ${knownBonds.length} связей, ${knownIsotopes.length} изотопов` +
        (hasDensity ? `, поле H загружено (${fieldDensity3D.metadata.resolution}³)` : '')
      : '⚠️ Базы не загружены — базовый режим';
    
    progressFill.style.width = '100%';
    setTimeout(() => {
      document.getElementById('progressBar').style.display = 'none';
      if (knowledgeLoaded) statusEl.textContent = '';
    }, 2000);
    
    return knowledgeLoaded;
  }

  function identifyPair(elA, elB, distance) {
    const key = elA.data.index < elB.data.index
      ? `${elA.data.index}-${elB.data.index}`
      : `${elB.data.index}-${elA.data.index}`;
    
    if (pairCache.has(key)) return pairCache.get(key);
    
    const s1 = elA.data.symbol, s2 = elB.data.symbol;
    let result = {knownBond:null, isotopeA:null, isotopeB:null};
    
    if (!knowledgeLoaded) { pairCache.set(key, result); return result; }
    
    for (let bond of knownBonds) {
      if (bond.elements.includes(s1) && bond.elements.includes(s2)) {
        const ed = bond.field_H_parameters.equilibrium_distance_fm;
        if (Math.abs(distance - ed) / ed < 0.2) { result.knownBond = bond; break; }
      }
    }
    result.isotopeA = knownIsotopes.find(i => i.parent_element === s1) || null;
    result.isotopeB = knownIsotopes.find(i => i.parent_element === s2) || null;
    
    pairCache.set(key, result);
    return result;
  }

  // ==================== СЦЕНА ====================
  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.0002);
    
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 600);
    camera.position.set(50, 35, 70);
    
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, preserveDrawingBuffer:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // щадим GPU
    document.body.appendChild(renderer.domElement);
    
    labelRenderer = new THREE.CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 10;
    controls.maxDistance = 200;
    
    const gridHelper = new THREE.GridHelper(100, 20, 0x112233, 0x050510);
    scene.add(gridHelper);
    
    const ambientLight = new THREE.AmbientLight(0x303030);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xcccccc, 0.7);
    dirLight.position.set(1, 1, 1);
    scene.add(dirLight);
    
    // Звёздный фон
    const starsGeo = new THREE.BufferGeometry();
    const stars = new Float32Array(600);
    for (let i=0;i<600;i++) stars[i] = (Math.random()-0.5)*300;
    starsGeo.setAttribute('position', new THREE.BufferAttribute(stars, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0x334466, size:0.3})));
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // ==================== ДАННЫЕ ====================
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        trajectoryData = JSON.parse(ev.target.result);
        if (!Array.isArray(trajectoryData) || !trajectoryData.length) {
          alert('❌ Файл не содержит траекторных данных');
          return;
        }
        document.getElementById('slider').max = trajectoryData.length - 1;
        document.getElementById('slider').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('captureBtn').disabled = false;
        pairCache.clear();
        createAllSpheres();
        loadFrame(0);
        updateDensitySlice();
      } catch(err) {
        alert('❌ Ошибка JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
  
  document.getElementById('loadBtn').addEventListener('click', () => 
    document.getElementById('fileInput').click()
  );

  // ==================== СФЕРЫ ====================
  function createAllSpheres() {
    // Очистка
    Object.values(groupObjects).forEach(objs => objs.forEach(obj => {
      scene.remove(obj.mesh);
      obj.mesh.geometry?.dispose();
      obj.mesh.material?.dispose();
      if (obj.label) obj.mesh.remove(obj.label);
    }));
    groupObjects = {};
    
    if (!trajectoryData.length) return;
    const sample = trajectoryData[0];
    let counter = 0;
    
    for (let g=1; g<=7; g++) {
      if (!sample.groups[g]) continue;
      groupObjects[g] = [];
      const color = colors[g-1];
      const radius = groupRadii[g] || 0.6;
      const geo = new THREE.SphereGeometry(radius, 14, 10);
      
      sample.groups[g].forEach(() => {
        const mat = new THREE.MeshPhongMaterial({
          color, shininess:30,
          emissive: new THREE.Color(color).multiplyScalar(0.15)
        });
        const sphere = new THREE.Mesh(geo, mat);
        sphere.userData = {symbol: symbols[counter+1]||'?', group:g, index:counter};
        scene.add(sphere);
        
        const div = document.createElement('div');
        div.className = 'element-label';
        div.textContent = sphere.userData.symbol;
        const label = new THREE.CSS2DObject(div);
        label.position.set(0, radius*2, 0);
        sphere.add(label);
        
        groupObjects[g].push({mesh:sphere, label, data:sphere.userData, trail:[]});
        counter++;
      });
    }
  }

  // ==================== ОЧИСТКА ЛИНИЙ ====================
  function clearLines() {
    quantumLines.forEach(l => { l.geometry.dispose(); l.material.dispose(); scene.remove(l); });
    quantumLines = [];
    trailLines.forEach(l => { l.geometry.dispose(); l.material.dispose(); scene.remove(l); });
    trailLines = [];
  }

  // ==================== КАДР ====================
  function loadFrame(idx) {
    if (!trajectoryData.length || idx >= trajectoryData.length) return;
    const frame = trajectoryData[idx];
    document.getElementById('stepLabel').textContent = frame.step;
    document.getElementById('dminLabel').textContent = frame.d_min?.toFixed(3) || '—';
    document.getElementById('slider').value = idx;
    currentFrame = idx;
    
    clearLines();
    
    let visibleCount = 0;
    for (let g=1; g<=7; g++) {
      if (!groupObjects[g] || !frame.groups?.[g]) continue;
      groupObjects[g].forEach((obj, i) => {
        if (i < frame.groups[g].length) {
          const [x,y,z] = frame.groups[g][i];
          obj.mesh.position.set(x, y, z);
          obj.mesh.visible = true;
          obj.label.visible = !playing;
          visibleCount++;
          if (!playing) {
            obj.trail.push(obj.mesh.position.clone());
            if (obj.trail.length > 20) obj.trail.shift();
          }
        } else {
          obj.mesh.visible = false;
          obj.label.visible = false;
        }
      });
    }
    
    if (!playing) {
      drawTrails();
      drawQuantumLines();
      updateDensitySlice();
    }
    
    document.getElementById('bondsLabel').textContent = quantumLines.length;
  }

  // ==================== ХВОСТЫ ====================
  function drawTrails() {
    for (let g=1; g<=7; g++) {
      if (!groupObjects[g]) continue;
      groupObjects[g].forEach(obj => {
        if (obj.mesh.visible && obj.trail.length > 1) {
          const geo = new THREE.BufferGeometry().setFromPoints(obj.trail);
          const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
            color: colors[g-1], opacity: 0.5, transparent: true
          }));
          scene.add(line);
          trailLines.push(line);
        }
      });
    }
  }

  // ==================== КВАНТОВЫЕ ЛИНИИ ====================
  function drawQuantumLines() {
    const threshold = 12.0;
    const allObjs = [];
    for (let g=1; g<=7; g++) {
      if (groupObjects[g]) groupObjects[g].forEach(o => { if(o.mesh.visible) allObjs.push(o); });
    }
    
    const connections = {};
    allObjs.forEach(o => connections[o.data.index] = new Set());
    
    for (let i=0; i<allObjs.length; i++) {
      for (let j=i+1; j<allObjs.length; j++) {
        const a = allObjs[i].mesh.position, b = allObjs[j].mesh.position;
        const dist = a.distanceTo(b);
        if (dist < threshold) {
          const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
          const opacity = Math.max(0.1, 1 - dist/threshold);
          const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
            color: 0xffffff, opacity, transparent: true
          }));
          scene.add(line);
          quantumLines.push(line);
          connections[allObjs[i].data.index].add(allObjs[j].data.index);
          connections[allObjs[j].data.index].add(allObjs[i].data.index);
        }
      }
    }
    
    window.lastConnections = connections;
    window.lastAllObjs = allObjs;
  }

  // ==================== УПРАВЛЕНИЕ ====================
  document.getElementById('playBtn').addEventListener('click', () => {
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
    if (!playing) loadFrame(currentFrame);
  });
  
  document.getElementById('slider').addEventListener('input', e => {
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    loadFrame(parseInt(e.target.value));
  });

  // ==================== ЗАХВАТ ====================
  document.getElementById('captureBtn').addEventListener('click', () => {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    
    const dataURL = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `frame_${currentFrame}.png`;
    a.click();
    
    const frame = trajectoryData?.[currentFrame];
    if (!frame) return;
    
    const connections = window.lastConnections || {};
    const allObjs = window.lastAllObjs || [];
    
    let report = `=== ОТЧЁТ ОРАКУЛА ===\n`;
    report += `SpectraVortex VMMS v3.0\n`;
    report += `Шаг: ${frame.step} | d_min: ${frame.d_min?.toFixed(3) || 'N/A'}\n`;
    report += `Базы: ${knownBonds.length} связей, ${knownIsotopes.length} изотопов\n`;
    report += `Поле H: ${fieldDensity3D ? 'загружено' : 'не загружено'}\n\n`;
    
    report += `--- Связи (d < 12.0) ---\n`;
    let pairFound = false;
    const processed = new Set();
    
    for (let i=0; i<allObjs.length; i++) {
      for (let j=i+1; j<allObjs.length; j++) {
        if (connections[allObjs[i].data.index]?.has(allObjs[j].data.index)) {
          const key = `${Math.min(allObjs[i].data.index,allObjs[j].data.index)}-${Math.max(allObjs[i].data.index,allObjs[j].data.index)}`;
          if (processed.has(key)) continue;
          processed.add(key);
          pairFound = true;
          
          const s1=allObjs[i].data.symbol, s2=allObjs[j].data.symbol;
          const dist = allObjs[i].mesh.position.distanceTo(allObjs[j].mesh.position);
          const id = identifyPair(allObjs[i], allObjs[j], dist);
          
          report += `${s1}-${s2} | ${dist.toFixed(2)}`;
          if (id.knownBond) report += ` | ✅ ${id.knownBond.formula} (${id.knownBond.crystal_structure}, ${id.knownBond.formation_enthalpy_kJ_mol} kJ/mol)`;
          report += '\n';
        }
      }
    }
    if (!pairFound) report += 'Связей не обнаружено\n';
    
    report += '\n--- Комплексы (≥3 атомов) ---\n';
    const visited = new Set();
    let complexFound = false;
    allObjs.forEach(obj => {
      if (visited.has(obj.data.index)) return;
      const component = [], queue = [obj.data.index];
      while (queue.length) {
        const idx = queue.shift();
        if (visited.has(idx)) continue;
        visited.add(idx);
        component.push(idx);
        (connections[idx]||[]).forEach(n => { if(!visited.has(n)) queue.push(n); });
      }
      if (component.length >= 3) {
        complexFound = true;
        const syms = component.map(idx => allObjs.find(o=>o.data.index===idx)?.data.symbol||'?').join('-');
        report += `[${syms}] (${component.length} атомов)\n`;
      }
    });
    if (!complexFound) report += 'Комплексов не обнаружено\n';
    
    const blob = new Blob([report], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const bLink = document.createElement('a');
    bLink.href = url;
    bLink.download = `frame_${currentFrame}_report.txt`;
    bLink.click();
    URL.revokeObjectURL(url);
  });

  // ==================== АЛХИМИЧЕСКИЙ РЕАКТОР ====================
  document.getElementById('alchemyToggle').addEventListener('click', () => {
    const panel = document.getElementById('alchemy-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') populateSelects();
  });
  
  function populateSelects() {
    const allSyms = symbols.filter(s => s!=='?');
    [document.getElementById('el1'), document.getElementById('el2')].forEach(sel => {
      if (sel.options.length === 0) {
        allSyms.forEach(s => { const opt = document.createElement('option'); opt.value=s; opt.textContent=s; sel.appendChild(opt); });
      }
    });
  }
  
  window.runReactor = function() {
    const s1 = document.getElementById('el1').value;
    const s2 = document.getElementById('el2').value;
    let obj1=null, obj2=null;
    for (let g in groupObjects) {
      groupObjects[g].forEach(o => {
        if (o.data.symbol===s1 && o.mesh.visible) obj1=o;
        if (o.data.symbol===s2 && o.mesh.visible) obj2=o;
      });
    }
    const div = document.getElementById('reactorResult');
    if (!obj1||!obj2) { div.innerHTML='❌ Элементы не на сцене'; return; }
    
    const dist = obj1.mesh.position.distanceTo(obj2.mesh.position);
    const grpDiff = Math.abs(obj1.data.group-obj2.data.group);
    let prob=0, stab='НЕСТАБИЛЕН', color='#f00';
    if (dist<8) prob=90; else if (dist<15) prob=60; else prob=Math.max(5, 30-grpDiff*8);
    if (prob>70) { stab='СТАБИЛЕН'; color='#0f0'; }
    else if (prob>40) { stab='МЕТАСТАБИЛЕН'; color='#ff0'; }
    
    let extra='';
    if (knowledgeLoaded) {
      const id = identifyPair(obj1, obj2, dist);
      if (id.knownBond) extra = `<br>✅ ${id.knownBond.formula} (${id.knownBond.crystal_structure})`;
    }
    div.innerHTML = `<b style="color:${color}">${s1}${s2}</b> | P:${prob}%<br>${stab} (${dist.toFixed(1)})${extra}`;
  };

  // ==================== ПЛОТНОСТЬ ПОЛЯ H ====================
  document.getElementById('densityToggle').addEventListener('click', () => {
    const panel = document.getElementById('density-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') {
      document.getElementById('densitySliceZ').max = (fieldDensity3D?.metadata.resolution || 64) - 1;
      updateDensitySlice();
    }
  });
  
  document.getElementById('densitySliceZ').addEventListener('input', updateDensitySlice);
  
  function updateDensitySlice() {
    if (!fieldDensity3D || !fieldDensity3D.data.length) return;
    
    const res = fieldDensity3D.metadata.resolution;
    const canvas = document.getElementById('densityCanvas');
    const ctx = canvas.getContext('2d');
    const z = parseInt(document.getElementById('densitySliceZ').value) || 0;
    
    canvas.width = res;
    canvas.height = res;
    
    const imageData = ctx.createImageData(res, res);
    const maxVal = fieldDensity3D.metadata.stats?.max || 48;
    
    for (let y=0; y<res; y++) {
      for (let x=0; x<res; x++) {
        const val = fieldDensity3D.getValue(x, y, z);
        const norm = Math.min(1, val / (maxVal * 0.7));
        const idx = (y * res + x) * 4;
        
        // Градиент: чёрный → синий → зелёный → жёлтый → белый
        if (norm < 0.25) {
          imageData.data[idx] = 0; imageData.data[idx+1] = 0; imageData.data[idx+2] = Math.floor(norm*4*255);
        } else if (norm < 0.5) {
          imageData.data[idx] = 0; imageData.data[idx+1] = Math.floor((norm-0.25)*4*255); imageData.data[idx+2] = 255;
        } else if (norm < 0.75) {
          imageData.data[idx] = Math.floor((norm-0.5)*4*255); imageData.data[idx+1] = 255; imageData.data[idx+2] = Math.floor((0.75-norm)*4*255);
        } else {
          imageData.data[idx] = 255; imageData.data[idx+1] = 255; imageData.data[idx+2] = Math.floor((norm-0.75)*4*255 + 255);
        }
        imageData.data[idx+3] = Math.floor(norm * 255);
      }
    }
    
    ctx.putImageData(imageData, 0, 0);
    document.getElementById('densityInfo').textContent = 
      `Слой ${z}/${res-1} | Макс: ${maxVal.toFixed(1)}`;
  }

  // ==================== АНИМАЦИЯ ====================
  function animate() {
    requestAnimationFrame(animate);
    if (playing && trajectoryData.length) {
      const next = (currentFrame + 1) % trajectoryData.length;
      loadFrame(next);
    }
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }

  // ==================== СТАРТ ====================
  window.startApp = async function() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('info-panel').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';
    initScene();
    await loadKnowledgeBases();
    animate();
  };
</script>
