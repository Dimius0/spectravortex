<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpectraVortex — Quantum Reactor v3.2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden;
      font-family: 'Courier New', monospace;
      background-color: #000; color: #0f0;
    }
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 1000;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    #loading-screen h1 {
      font-size: 2.2em; margin-bottom: 0.3em;
      text-shadow: 0 0 15px #0f0; letter-spacing: 3px;
    }
    #loading-screen p { margin: 5px 0; color: #0a0; }
    #loading-screen button {
      background: transparent; color: #0f0; border: 2px solid #0f0;
      padding: 15px 40px; font-size: 1.5em; cursor: pointer;
      margin-top: 2em; font-family: inherit; transition: all 0.3s;
    }
    #loading-screen button:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
    .progress-bar { width: 350px; height: 6px; border: 1px solid #0a0; margin-top: 1.5em; background: #111; }
    .progress-fill { height: 100%; background: #0f0; width: 0%; transition: width 0.4s ease; box-shadow: 0 0 8px #0f0; }
    
    #info-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0,0,0,0.75); padding: 12px 16px;
      border-left: 3px solid #0f0; z-index: 10; pointer-events: none;
      font-size: 13px; line-height: 1.6;
    }
    #controls {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.85); padding: 12px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 10;
    }
    button {
      background: #0f0; color: #000; border: none;
      padding: 8px 16px; cursor: pointer; font-weight: bold;
      font-family: inherit; font-size: 13px; transition: all 0.2s;
    }
    button:hover:not(:disabled) { box-shadow: 0 0 15px #0f0; }
    button:disabled { background: #222; color: #555; cursor: not-allowed; }
    input[type=range] { flex-grow: 1; cursor: pointer; background: #222; height: 5px; accent-color: #0f0; min-width: 100px; }
    
    #status-message {
      position: absolute; bottom: 85px; left: 20px;
      color: #ff0; z-index: 10; font-size: 11px;
      background: rgba(0,0,0,0.6); padding: 4px 8px;
    }
    
    #alchemy-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.85); border: 1px solid #ff0;
      padding: 12px; color: #ff0; z-index: 10; width: 260px;
      display: none; font-size: 12px;
    }
    #alchemy-panel h4 { margin: 0 0 8px 0; text-align: center; }
    #alchemy-panel select {
      width: 100%; background: #111; color: #0f0;
      border: 1px solid #0f0; padding: 5px; margin-bottom: 6px; font-family: inherit;
    }
    
    #atom-detail {
      position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
      background: rgba(0,0,0,0.9); border: 1px solid #0ff;
      padding: 14px; color: #0ff; z-index: 20;
      width: 300px; display: none; font-size: 11px; line-height: 1.7;
      max-height: 520px; overflow-y: auto;
    }
    #atom-detail h4 { margin: 0 0 10px 0; color: #fff; text-align: center; font-size: 14px; }
    #atom-detail .prop { color: #aaa; }
    #atom-detail .val { color: #0f0; }
    #atom-detail .radioactive { color: #f55; font-weight: bold; }
    
    #density-panel {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.85); border: 1px solid #08f;
      padding: 10px; color: #08f; z-index: 10; font-size: 11px;
      display: none;
    }
    #density-panel h4 { margin: 0 0 8px 0; text-align: center; }
    
    .element-label {
      color: #fff; font-size: 10px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 5px #000, 0 0 2px #000;
      pointer-events: none; user-select: none;
      background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 2px;
    }
    .radioactive-star {
      color: #f55; font-size: 12px; pointer-events: none; user-select: none;
      text-shadow: 0 0 8px #f00;
    }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #0f0; }
  </style>
</head>
<body>

<div id="loading-screen">
  <h1>⚛ SPECTRA VORTEX</h1>
  <p>Virtual Molecular Modeling System v3.2</p>
  <p>Поле H • Плотность • Квантовые связи</p>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <button onclick="startApp()">ИНИЦИАЛИЗИРОВАТЬ РЕАКТОР</button>
</div>

<div id="info-panel" style="display:none;">
  <b>SPECTRA VORTEX</b><br>
  Шаг: <span id="stepLabel">—</span><br>
  d_min: <span id="dminLabel">—</span><br>
  Связей: <span id="bondsLabel">—</span>
</div>

<div id="status-message"></div>

<div id="controls" style="display:none;">
  <button id="loadBtn">📂 JSON</button>
  <button id="playBtn" disabled>▶</button>
  <input type="range" id="slider" min="0" max="0" value="0" step="1" disabled>
  <button id="captureBtn" disabled>📸</button>
  <button id="alchemyToggle">⚗️</button>
  <button id="densityToggle">🔥 Поле</button>
  <button id="clearSelectBtn" disabled>✕ Сброс</button>
  <input type="file" id="fileInput" accept=".json" style="display:none;">
</div>

<div id="alchemy-panel">
  <h4>⚗️ Алхимический Реактор</h4>
  <select id="el1"></select>
  <select id="el2"></select>
  <button onclick="runReactor()" style="width:100%;margin-top:6px;">СИНТЕЗИРОВАТЬ</button>
  <div id="reactorResult" style="margin-top:10px;font-size:11px;"></div>
</div>

<div id="atom-detail">
  <h4>🔬 Детектор атома</h4>
  <div id="atomDetailContent">Кликните по сфере</div>
</div>

<div id="density-panel">
  <h4>🔥 Плотность поля H</h4>
  <div>Z-слой: <input type="range" id="densitySliceZ" min="0" max="63" value="32" style="width:100%;"></div>
  <canvas id="densityCanvas" width="128" height="128" style="width:100%;margin-top:8px;image-rendering:pixelated;"></canvas>
  <div id="densityInfo" style="margin-top:5px;font-size:10px;">Слой 32/63</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

<script>
  // ==================== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ====================
  let scene, camera, renderer, labelRenderer, controls, raycaster, mouse;
  let trajectoryData = [], currentFrame = 0, playing = false;
  let groupObjects = {}, quantumLines = [], trailLines = [];
  let knownBonds = [], knownIsotopes = [], fieldDensity3D = null, knowledgeLoaded = false;
  let selectedAtoms = [], pulseLine = null, pulsePhase = 0;
  
  // ==================== КОНСТАНТЫ ====================
  // Цвета радуги: КРАСНЫЙ-ОРАНЖЕВЫЙ-ЖЁЛТЫЙ-ЗЕЛЁНЫЙ-ГОЛУБОЙ-СИНИЙ-ФИОЛЕТОВЫЙ
  const groupColors = ['#ff3333','#ff8800','#ffdd00','#33cc33','#3399ff','#4444cc','#9933ff'];
  const symbols = ['?','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar',
    'K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr',
    'Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe',
    'Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu',
    'Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra',
    'Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr'];
  // Пропорциональные радиусы оболочек
  const groupRadii = {1:0.4, 2:0.6, 3:0.8, 4:1.0, 5:1.2, 6:1.4, 7:1.6};
  
  // Радиоактивные элементы
  const radioactiveElements = new Set([
    'Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm',
    'Bk','Cf','Es','Fm','Md','No','Lr','Tc','Pm'
  ]);
  
  const pairCache = new Map();
  const BASE_PATH = 'data/';

  // ==================== БАЗЫ ЗНАНИЙ ====================
  async function loadKnowledgeBases() {
    const statusEl = document.getElementById('status-message');
    const progressFill = document.getElementById('progressFill');
    statusEl.textContent = '⏳ Загрузка баз знаний...';
    progressFill.style.width = '5%';
    
    const bases = [
      {name:'bonds', file:'field_H_intermetallides_known.json'},
      {name:'isotopes', file:'field_H_isotopes_perturbations.json'},
      {name:'density', file:'field_h_density_3d.json'}
    ];
    
    const results = await Promise.allSettled(
      bases.map(b => fetch(BASE_PATH + b.file).then(r => r.ok ? r.json() : Promise.reject(r.status)))
    );
    
    results.forEach((res, i) => {
      if (res.status === 'fulfilled') {
        const data = res.value;
        if (i === 0) knownBonds = data.bonds || [];
        else if (i === 1) knownIsotopes = data.perturbations || [];
        else if (i === 2) {
          fieldDensity3D = {
            metadata: data.metadata || {},
            data: new Float32Array(data.density_3d || []),
            getValue: function(ix,iy,iz) {
              const R = this.metadata.resolution || 64;
              if (ix<0||ix>=R||iy<0||iy>=R||iz<0||iz>=R) return 0;
              return this.data[ix + iy*R + iz*R*R] || 0;
            }
          };
        }
      } else { console.warn(`База ${bases[i].name}: ошибка загрузки`); }
      progressFill.style.width = `${5 + (i+1)*25}%`;
    });
    
    knowledgeLoaded = knownBonds.length > 0 || knownIsotopes.length > 0;
    progressFill.style.width = '85%';
    
    const hasDensity = fieldDensity3D && fieldDensity3D.data.length > 0;
    statusEl.textContent = knowledgeLoaded
      ? `✅ Базы: ${knownBonds.length} связей, ${knownIsotopes.length} изотопов` +
        (hasDensity ? `, поле H (${fieldDensity3D.metadata.resolution}³)` : '')
      : '⚠️ Базовый режим';
    
    progressFill.style.width = '100%';
    setTimeout(() => {
      document.getElementById('progressBar').style.display = 'none';
      if (knowledgeLoaded) statusEl.textContent = '';
    }, 2000);
    return knowledgeLoaded;
  }

  function identifyPair(elA, elB, distance) {
    const key = elA.data.index < elB.data.index ? `${elA.data.index}-${elB.data.index}` : `${elB.data.index}-${elA.data.index}`;
    if (pairCache.has(key)) return pairCache.get(key);
    const s1=elA.data.symbol, s2=elB.data.symbol;
    let result = {knownBond:null, isotopeA:null, isotopeB:null};
    if (!knowledgeLoaded) { pairCache.set(key, result); return result; }
    for (let bond of knownBonds) {
      if (bond.elements.includes(s1) && bond.elements.includes(s2)) {
        const ed = bond.field_H_parameters.equilibrium_distance_fm;
        if (Math.abs(distance-ed)/ed < 0.2) { result.knownBond = bond; break; }
      }
    }
    result.isotopeA = knownIsotopes.find(i => i.parent_element === s1) || null;
    result.isotopeB = knownIsotopes.find(i => i.parent_element === s2) || null;
    pairCache.set(key, result);
    return result;
  }

  // ==================== ТЕКСТУРА ВИХРЯ ====================
  const textureCache = {};
  function createVortexTexture(baseColor, group) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, size, size);
    
    const cx = size/2, cy = size/2;
    const maxR = size/2 - 4;
    
    for (let arm = 0; arm < 2; arm++) {
      const armAngle = arm * Math.PI;
      ctx.beginPath();
      for (let r = 1; r < maxR; r += 2) {
        const angle = armAngle + r * 0.15;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (r === 1) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = baseColor;
      ctx.lineWidth = 3 + group * 0.4;
      ctx.globalAlpha = 0.65;
      ctx.stroke();
    }
    
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 0.35);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.15, baseColor);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(0, 0, size, size);
    
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.95;
    ctx.fill();
    ctx.globalAlpha = 1;
    
    return new THREE.CanvasTexture(canvas);
  }
  
  function getVortexTexture(group) {
    if (!textureCache[group]) {
      textureCache[group] = createVortexTexture(groupColors[group-1], group);
    }
    return textureCache[group];
  }

  // ==================== СЦЕНА ====================
  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.0002);
    
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 600);
    camera.position.set(50, 35, 70);
    
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, preserveDrawingBuffer:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    
    labelRenderer = new THREE.CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 10; controls.maxDistance = 200;
    
    raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 1.5;
    mouse = new THREE.Vector2();
    
    scene.add(new THREE.GridHelper(100, 20, 0x112233, 0x050510));
    scene.add(new THREE.AmbientLight(0x303030));
    const dirLight = new THREE.DirectionalLight(0xcccccc, 0.7);
    dirLight.position.set(1,1,1); scene.add(dirLight);
    
    const starsGeo = new THREE.BufferGeometry();
    const stars = new Float32Array(600);
    for (let i=0;i<600;i++) stars[i] = (Math.random()-0.5)*300;
    starsGeo.setAttribute('position', new THREE.BufferAttribute(stars, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0x334466, size:0.3})));
    
    renderer.domElement.addEventListener('click', onCanvasClick);
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // ==================== КЛИК ПО СФЕРЕ ====================
  function onCanvasClick(event) {
    if (!trajectoryData.length) return;
    
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    
    const allMeshes = [];
    for (let g in groupObjects) {
      groupObjects[g].forEach(obj => { if(obj.mesh.visible) allMeshes.push(obj.mesh); });
    }
    
    const intersects = raycaster.intersectObjects(allMeshes);
    if (intersects.length > 0) {
      const mesh = intersects[0].object;
      const obj = findObjectByMesh(mesh);
      if (obj) selectAtom(obj);
    }
  }
  
  function findObjectByMesh(mesh) {
    for (let g in groupObjects) {
      for (let obj of groupObjects[g]) {
        if (obj.mesh === mesh) return obj;
      }
    }
    return null;
  }
  
  function selectAtom(obj) {
    if (selectedAtoms.length >= 2) clearSelection();
    
    const existingIdx = selectedAtoms.findIndex(s => s.obj === obj);
    if (existingIdx >= 0) {
      removeSelectionHighlight(selectedAtoms[existingIdx]);
      selectedAtoms.splice(existingIdx, 1);
    } else {
      selectedAtoms.push({obj, ring: null});
      addSelectionHighlight(obj);
    }
    
    updateSelectionUI();
    
    if (selectedAtoms.length === 2) {
      drawPulseLine(selectedAtoms[0].obj, selectedAtoms[1].obj);
    } else {
      clearPulseLine();
    }
    
    showAtomDetail(obj);
  }
  
  function addSelectionHighlight(obj) {
    const ringGeo = new THREE.TorusGeometry(groupRadii[obj.data.group]*1.35, 0.08, 8, 16);
    const ringMat = new THREE.MeshBasicMaterial({color: 0xffff00});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(obj.mesh.position);
    scene.add(ring);
    
    const idx = selectedAtoms.findIndex(s => s.obj === obj);
    if (idx >= 0) selectedAtoms[idx].ring = ring;
  }
  
  function removeSelectionHighlight(selection) {
    if (selection.ring) {
      scene.remove(selection.ring);
      selection.ring.geometry.dispose();
      selection.ring.material.dispose();
    }
  }
  
  function clearSelection() {
    selectedAtoms.forEach(s => removeSelectionHighlight(s));
    selectedAtoms = [];
    clearPulseLine();
    document.getElementById('clearSelectBtn').disabled = true;
    document.getElementById('atom-detail').style.display = 'none';
  }
  
  function updateSelectionUI() {
    document.getElementById('clearSelectBtn').disabled = selectedAtoms.length === 0;
  }
  
  function drawPulseLine(objA, objB) {
    clearPulseLine();
    const geo = new THREE.BufferGeometry().setFromPoints([objA.mesh.position, objB.mesh.position]);
    pulseLine = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xffff00, linewidth:1, transparent:true, opacity:0.8}));
    scene.add(pulseLine);
  }
  
  function clearPulseLine() {
    if (pulseLine) { scene.remove(pulseLine); pulseLine.geometry.dispose(); pulseLine.material.dispose(); pulseLine = null; }
  }
  
  document.getElementById('clearSelectBtn').addEventListener('click', clearSelection);
  
  function showAtomDetail(obj) {
    const d = obj.data;
    const pos = obj.mesh.position;
    const radius = groupRadii[d.group];
    const isRadioactive = radioactiveElements.has(d.symbol);
    const isotope = knownIsotopes.find(i => i.parent_element === d.symbol);
    
    let html = `<h4>${isRadioactive ? '☢️ ' : ''}${d.symbol} (Группа ${d.group})</h4>`;
    html += `<span class="prop">Индекс:</span> <span class="val">${d.index}</span><br>`;
    html += `<span class="prop">Радиус оболочки:</span> <span class="val">${radius.toFixed(2)} Å</span><br>`;
    html += `<hr style="border-color:#333;">`;
    html += `<span class="prop">📍 Координаты центра:</span><br>`;
    html += `<span class="val">X: ${pos.x.toFixed(3)}</span><br>`;
    html += `<span class="val">Y: ${pos.y.toFixed(3)}</span><br>`;
    html += `<span class="val">Z: ${pos.z.toFixed(3)}</span><br>`;
    
    if (isRadioactive) {
      html += `<hr style="border-color:#333;">`;
      html += `<span class="radioactive">☢️ РАДИОАКТИВЕН</span><br>`;
    } else {
      html += `<span class="val">✓ Стабилен</span><br>`;
    }
    
    if (isotope) {
      html += `<span class="prop">Изотоп:</span> <span class="val">${isotope.isotope_symbol || '—'}</span><br>`;
      html += `<span class="prop">Период полураспада:</span> <span class="val">${isotope.half_life || '—'}</span><br>`;
    }
    
    // Два расстояния при двух выделенных атомах
    if (selectedAtoms.length === 2) {
      const objB = selectedAtoms[0].obj === obj ? selectedAtoms[1].obj : selectedAtoms[0].obj;
      const posB = objB.mesh.position;
      const rA = groupRadii[d.group];
      const rB = groupRadii[objB.data.group];
      const distCenter = pos.distanceTo(posB);
      const distShell = distCenter - rA - rB;
      
      html += `<hr style="border-color:#ff0;">`;
      html += `<span class="prop" style="color:#ff0;">📏 К ${objB.data.symbol} (Группа ${objB.data.group}, R=${rB.toFixed(2)}):</span><br>`;
      html += `<span class="prop">Центр→Центр:</span> <span class="val" style="font-size:14px;color:#ff0;">${distCenter.toFixed(2)} Å</span><br>`;
      html += `<span class="prop">Оболочка→Оболочка:</span> <span class="val" style="font-size:14px;color:#ff0;">${distShell.toFixed(2)} Å</span>`;
      if (distShell < 0) html += ` <span style="color:#f55;">(ПЕРЕКРЫТИЕ!)</span>`;
      html += `<br>`;
      
      const id = identifyPair(selectedAtoms[0].obj, selectedAtoms[1].obj, distCenter);
      if (id.knownBond) {
        html += `<br><span class="val">✅ ${id.knownBond.formula} (${id.knownBond.crystal_structure})</span>`;
        html += `<br><span class="prop">Энтальпия:</span> <span class="val">${id.knownBond.formation_enthalpy_kJ_mol} кДж/моль</span>`;
      }
    }
    
    document.getElementById('atomDetailContent').innerHTML = html;
    document.getElementById('atom-detail').style.display = 'block';
  }

  // ==================== ЗАГРУЗКА ДАННЫХ ====================
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        trajectoryData = JSON.parse(ev.target.result);
        if (!Array.isArray(trajectoryData) || !trajectoryData.length) {
          alert('❌ Файл не содержит траекторных данных'); return;
        }
        document.getElementById('slider').max = trajectoryData.length - 1;
        document.getElementById('slider').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('captureBtn').disabled = false;
        pairCache.clear(); clearSelection();
        document.getElementById('atom-detail').style.display = 'none';
        createAllSpheres(); loadFrame(0); updateDensitySlice();
      } catch(err) { alert('❌ Ошибка JSON: ' + err.message); }
    };
    reader.readAsText(file);
  });
  document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());

  // ==================== СФЕРЫ С ТЕКСТУРОЙ ВИХРЯ ====================
  function createAllSpheres() {
    Object.values(groupObjects).forEach(objs => objs.forEach(obj => {
      scene.remove(obj.mesh);
      obj.mesh.geometry?.dispose();
      obj.mesh.material?.dispose();
      if(obj.label) obj.mesh.remove(obj.label);
      if(obj.radioStar) obj.mesh.remove(obj.radioStar);
    }));
    groupObjects = {};
    if (!trajectoryData.length) return;
    
    const sample = trajectoryData[0];
    let counter = 0;
    
    for (let g = 1; g <= 7; g++) {
      if (!sample.groups[g]) continue;
      groupObjects[g] = [];
      const radius = groupRadii[g];
      const geo = new THREE.SphereGeometry(radius, 32, 24);
      const texture = getVortexTexture(g);
      
      sample.groups[g].forEach(() => {
        const sym = symbols[counter + 1] || '?';
        const mat = new THREE.MeshPhongMaterial({
          map: texture,
          color: 0xffffff,
          shininess: 25,
          emissive: new THREE.Color(groupColors[g-1]).multiplyScalar(0.1),
          specular: 0x333333
        });
        const sphere = new THREE.Mesh(geo, mat);
        sphere.userData = {symbol: sym, group: g, index: counter};
        scene.add(sphere);
        
        // Подпись элемента
        const div = document.createElement('div');
        div.className = 'element-label';
        div.textContent = sym;
        const label = new THREE.CSS2DObject(div);
        label.position.set(0, radius * 2.2, 0);
        sphere.add(label);
        
        // Звёздочка для радиоактивных
        let radioStar = null;
        if (radioactiveElements.has(sym)) {
          const starDiv = document.createElement('div');
          starDiv.className = 'radioactive-star';
          starDiv.textContent = '☢';
          radioStar = new THREE.CSS2DObject(starDiv);
          radioStar.position.set(radius * 1.2, radius * 1.2, 0);
          sphere.add(radioStar);
        }
        
        groupObjects[g].push({
          mesh: sphere, label: label, radioStar: radioStar,
          data: sphere.userData, trail: []
        });
        counter++;
      });
    }
  }

  // ==================== ОЧИСТКА ЛИНИЙ ====================
  function clearLines() {
    quantumLines.forEach(l => { l.geometry.dispose(); l.material.dispose(); scene.remove(l); });
    quantumLines = [];
    trailLines.forEach(l => { l.geometry.dispose(); l.material.dispose(); scene.remove(l); });
    trailLines = [];
  }

  // ==================== ОТРИСОВКА КАДРА ====================
  function loadFrame(idx) {
    if (!trajectoryData.length || idx >= trajectoryData.length) return;
    const frame = trajectoryData[idx];
    document.getElementById('stepLabel').textContent = frame.step;
    document.getElementById('dminLabel').textContent = frame.d_min?.toFixed(3) || '—';
    document.getElementById('slider').value = idx;
    currentFrame = idx;
    clearLines();
    
    for (let g = 1; g <= 7; g++) {
      if (!groupObjects[g] || !frame.groups?.[g]) continue;
      groupObjects[g].forEach((obj, i) => {
        if (i < frame.groups[g].length) {
          const [x,y,z] = frame.groups[g][i];
          obj.mesh.position.set(x, y, z);
          obj.mesh.visible = true;
          obj.label.visible = !playing;
          if (obj.radioStar) obj.radioStar.visible = !playing;
          if (!playing) {
            obj.trail.push(obj.mesh.position.clone());
            if (obj.trail.length > 20) obj.trail.shift();
          }
        } else {
          obj.mesh.visible = false;
          obj.label.visible = false;
          if (obj.radioStar) obj.radioStar.visible = false;
        }
      });
    }
    
    // Обновляем выделение
    selectedAtoms.forEach(s => { if (s.ring) s.ring.position.copy(s.obj.mesh.position); });
    if (pulseLine && selectedAtoms.length === 2) {
      pulseLine.geometry.dispose();
      pulseLine.geometry = new THREE.BufferGeometry().setFromPoints([
        selectedAtoms[0].obj.mesh.position, selectedAtoms[1].obj.mesh.position
      ]);
    }
    
    if (!playing) {
      drawTrails();
      drawQuantumLines();
      updateDensitySlice();
    }
    
    document.getElementById('bondsLabel').textContent = quantumLines.length;
  }

  function drawTrails() {
    for (let g = 1; g <= 7; g++) {
      if (!groupObjects[g]) continue;
      groupObjects[g].forEach(obj => {
        if (obj.mesh.visible && obj.trail.length > 1) {
          const geo = new THREE.BufferGeometry().setFromPoints(obj.trail);
          const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
            color: groupColors[g-1], opacity: 0.5, transparent: true
          }));
          scene.add(line);
          trailLines.push(line);
        }
      });
    }
  }

  function drawQuantumLines() {
    const threshold = 12.0;
    const allObjs = [];
    for (let g = 1; g <= 7; g++) {
      if (groupObjects[g]) groupObjects[g].forEach(o => { if (o.mesh.visible) allObjs.push(o); });
    }
    const connections = {};
    allObjs.forEach(o => connections[o.data.index] = new Set());
    
    for (let i = 0; i < allObjs.length; i++) {
      for (let j = i + 1; j < allObjs.length; j++) {
        const a = allObjs[i].mesh.position, b = allObjs[j].mesh.position;
        const dist = a.distanceTo(b);
        if (dist < threshold) {
          const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
          const opacity = Math.max(0.1, 1 - dist / threshold);
          const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
            color: 0xffffff, opacity: opacity, transparent: true
          }));
          scene.add(line);
          quantumLines.push(line);
          connections[allObjs[i].data.index].add(allObjs[j].data.index);
          connections[allObjs[j].data.index].add(allObjs[i].data.index);
        }
      }
    }
    window.lastConnections = connections;
    window.lastAllObjs = allObjs;
  }

  // ==================== УПРАВЛЕНИЕ ====================
  document.getElementById('playBtn').addEventListener('click', () => {
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
    if (!playing) loadFrame(currentFrame);
  });
  document.getElementById('slider').addEventListener('input', e => {
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    loadFrame(parseInt(e.target.value));
  });

  // ==================== ЗАХВАТ КАДРА И ОТЧЁТА ====================
  document.getElementById('captureBtn').addEventListener('click', () => {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    
    const a = document.createElement('a');
    a.href = renderer.domElement.toDataURL('image/png');
    a.download = `frame_${currentFrame}.png`;
    a.click();
    
    const frame = trajectoryData?.[currentFrame];
    if (!frame) return;
    
    const connections = window.lastConnections || {};
    const allObjs = window.lastAllObjs || [];
    
    let report = `=== ОТЧЁТ ОРАКУЛА ===\nSpectraVortex VMMS v3.2\nШаг: ${frame.step} | d_min: ${frame.d_min?.toFixed(3)||'N/A'}\nБазы: ${knownBonds.length} связей, ${knownIsotopes.length} изотопов\n\n--- Связи (d < 12.0) ---\n`;
    
    let pairFound = false;
    const processed = new Set();
    for (let i = 0; i < allObjs.length; i++) {
      for (let j = i + 1; j < allObjs.length; j++) {
        if (connections[allObjs[i].data.index]?.has(allObjs[j].data.index)) {
          const key = `${Math.min(allObjs[i].data.index,allObjs[j].data.index)}-${Math.max(allObjs[i].data.index,allObjs[j].data.index)}`;
          if (processed.has(key)) continue;
          processed.add(key); pairFound = true;
          const s1 = allObjs[i].data.symbol, s2 = allObjs[j].data.symbol;
          const distCenter = allObjs[i].mesh.position.distanceTo(allObjs[j].mesh.position);
          const r1 = groupRadii[allObjs[i].data.group], r2 = groupRadii[allObjs[j].data.group];
          const distShell = distCenter - r1 - r2;
          const id = identifyPair(allObjs[i], allObjs[j], distCenter);
          report += `${s1}-${s2} | Центр:${distCenter.toFixed(2)} | Оболочка:${distShell.toFixed(2)}`;
          if (distShell < 0) report += ' (ПЕРЕКРЫТИЕ)';
          if (id.knownBond) report += ` | ✅ ${id.knownBond.formula} (${id.knownBond.crystal_structure}, ${id.knownBond.formation_enthalpy_kJ_mol} kJ/mol)`;
          report += '\n';
        }
      }
    }
    if (!pairFound) report += 'Связей не обнаружено\n';
    
    report += '\n--- Комплексы (≥3 атомов) ---\n';
    const visited = new Set(); let complexFound = false;
    allObjs.forEach(obj => {
      if (visited.has(obj.data.index)) return;
      const component = [], queue = [obj.data.index];
      while (queue.length) {
        const idx = queue.shift();
        if (visited.has(idx)) continue;
        visited.add(idx);
        component.push(idx);
        (connections[idx]||[]).forEach(n => { if(!visited.has(n)) queue.push(n); });
      }
      if (component.length >= 3) {
        complexFound = true;
        report += `[${component.map(idx => allObjs.find(o=>o.data.index===idx)?.data.symbol||'?').join('-')}] (${component.length} атомов)\n`;
      }
    });
    if (!complexFound) report += 'Комплексов не обнаружено\n';
    
    const blob = new Blob([report], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const bLink = document.createElement('a');
    bLink.href = url; bLink.download = `frame_${currentFrame}_report.txt`; bLink.click();
    URL.revokeObjectURL(url);
  });

  // ==================== АЛХИМИЧЕСКИЙ РЕАКТОР ====================
  document.getElementById('alchemyToggle').addEventListener('click', () => {
    const panel = document.getElementById('alchemy-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') populateSelects();
  });
  
  function populateSelects() {
    const allSyms = symbols.filter(s => s !== '?');
    [document.getElementById('el1'), document.getElementById('el2')].forEach(sel => {
      if (sel.options.length === 0) {
        allSyms.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s; opt.textContent = s; sel.appendChild(opt);
        });
      }
    });
  }
  
  window.runReactor = function() {
    const s1 = document.getElementById('el1').value;
    const s2 = document.getElementById('el2').value;
    let obj1 = null, obj2 = null;
    for (let g in groupObjects) groupObjects[g].forEach(o => {
      if (o.data.symbol === s1 && o.mesh.visible) obj1 = o;
      if (o.data.symbol === s2 && o.mesh.visible) obj2 = o;
    });
    const div = document.getElementById('reactorResult');
    if (!obj1 || !obj2) { div.innerHTML = '❌ Элементы не на сцене'; return; }
    
    const dist = obj1.mesh.position.distanceTo(obj2.mesh.position);
    const r1 = groupRadii[obj1.data.group];
    const r2 = groupRadii[obj2.data.group];
    const distShell = dist - r1 - r2;
    const grpDiff = Math.abs(obj1.data.group - obj2.data.group);
    
    let prob = 0, stab = 'НЕСТАБИЛЕН', color = '#f00';
    if (dist < 8) prob = 90;
    else if (dist < 15) prob = 60;
    else prob = Math.max(5, 30 - grpDiff * 8);
    
    if (prob > 70) { stab = 'СТАБИЛЕН'; color = '#0f0'; }
    else if (prob > 40) { stab = 'МЕТАСТАБИЛЕН'; color = '#ff0'; }
    
    let extra = '';
    if (knowledgeLoaded) {
      const id = identifyPair(obj1, obj2, dist);
      if (id.knownBond) extra = `<br>✅ ${id.knownBond.formula} (${id.knownBond.crystal_structure})`;
    }
    
    div.innerHTML = `<b style="color:${color}">${s1}${s2}</b> | P:${prob}%<br>${stab}<br>Центр→Центр: ${dist.toFixed(2)} Å<br>Оболочка→Оболочка: ${distShell.toFixed(2)} Å${distShell < 0 ? ' <span style="color:#f55;">(ПЕРЕКРЫТИЕ)</span>' : ''}${extra}`;
  };

  // ==================== ПЛОТНОСТЬ ПОЛЯ H ====================
  document.getElementById('densityToggle').addEventListener('click', () => {
    const panel = document.getElementById('density-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') {
      document.getElementById('densitySliceZ').max = (fieldDensity3D?.metadata.resolution || 64) - 1;
      updateDensitySlice();
    }
  });
  document.getElementById('densitySliceZ').addEventListener('input', updateDensitySlice);
  
  function updateDensitySlice() {
    if (!fieldDensity3D || !fieldDensity3D.data.length) return;
    
    const res = fieldDensity3D.metadata.resolution;
    const canvas = document.getElementById('densityCanvas');
    const ctx = canvas.getContext('2d');
    const z = parseInt(document.getElementById('densitySliceZ').value) || 0;
    canvas.width = res; canvas.height = res;
    
    const imageData = ctx.createImageData(res, res);
    const maxVal = fieldDensity3D.metadata.stats?.max || 48;
    
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const val = fieldDensity3D.getValue(x, y, z);
        const norm = Math.min(1, val / (maxVal * 0.7));
        const idx = (y * res + x) * 4;
        
        if (norm < 0.25) {
          imageData.data[idx] = 0;
          imageData.data[idx+1] = 0;
          imageData.data[idx+2] = Math.floor(norm * 4 * 255);
        } else if (norm < 0.5) {
          imageData.data[idx] = 0;
          imageData.data[idx+1] = Math.floor((norm - 0.25) * 4 * 255);
          imageData.data[idx+2] = 255;
        } else if (norm < 0.75) {
          imageData.data[idx] = Math.floor((norm - 0.5) * 4 * 255);
          imageData.data[idx+1] = 255;
          imageData.data[idx+2] = Math.floor((0.75 - norm) * 4 * 255);
        } else {
          imageData.data[idx] = 255;
          imageData.data[idx+1] = 255;
          imageData.data[idx+2] = Math.floor((norm - 0.75) * 4 * 255 + 255);
        }
        imageData.data[idx+3] = Math.floor(norm * 255);
      }
    }
    
    ctx.putImageData(imageData, 0, 0);
    document.getElementById('densityInfo').textContent = 
      `Слой ${z}/${res-1} | Макс плотность: ${maxVal.toFixed(1)}`;
  }

  // ==================== АНИМАЦИЯ ====================
  function animate() {
    requestAnimationFrame(animate);
    
    if (playing && trajectoryData.length) {
      const next = (currentFrame + 1) % trajectoryData.length;
      loadFrame(next);
    }
    
    // Пульсация линии между выбранными атомами
    if (pulseLine && selectedAtoms.length === 2) {
      pulsePhase += 0.05;
      const alpha = 0.5 + 0.5 * Math.sin(pulsePhase * 3);
      pulseLine.material.opacity = alpha;
      pulseLine.material.color.setHex(alpha > 0.7 ? 0xffaa00 : 0xffff00);
    }
    
    // Пульсация колец выделения
    selectedAtoms.forEach(s => {
      if (s.ring) {
        const scale = 1 + 0.1 * Math.sin(pulsePhase * 2);
        s.ring.scale.setScalar(scale);
      }
    });
    
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }

  // ==================== СТАРТ ====================
  window.startApp = async function() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('info-panel').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';
    initScene();
    await loadKnowledgeBases();
    animate();
  };
</script>
</body>
