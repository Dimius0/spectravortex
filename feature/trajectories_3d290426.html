<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpectraVortex — Оракул Синтеза (Fast)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; background-color: #050510; }
    #info {
      position: absolute; top: 20px; left: 20px;
      color: #0f0; background: rgba(0,0,0,0.7); padding: 10px 15px;
      border-radius: 5px; pointer-events: none; font-size: 14px;
      border-left: 3px solid #0f0; z-index: 10;
    }
    #oracle-panel {
      position: absolute; bottom: 100px; right: 20px;
      width: 320px; height: 220px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #0f0; border-radius: 8px;
      padding: 12px; color: #0f0;
      font-family: 'Courier New', monospace; font-size: 14px; /* УВЕЛИЧИЛИ ШРИФТ */
      overflow: hidden; pointer-events: none; z-index: 10;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
    }
    #oracle-title {
      text-align: center; border-bottom: 1px solid #0f0;
      margin-bottom: 8px; padding-bottom: 4px;
      font-weight: bold; letter-spacing: 2px; opacity: 0.8; font-size: 16px;
    }
    #oracle-log {
      height: calc(100% - 35px); overflow-y: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .oracle-line {
      margin: 2px 0; opacity: 0; transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      text-shadow: 0 0 5px #0f0; word-break: break-all; line-height: 1.4;
    }
    .oracle-line.show { opacity: 1; transform: translateY(0); }
    .oracle-line.fade { opacity: 0; transition: opacity 2s; }
    
    #controls {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.8); padding: 12px 18px;
      border-radius: 8px; color: #ccc; display: flex;
      flex-wrap: wrap; align-items: center; gap: 12px;
      font-size: 13px; border-top: 1px solid #333; z-index: 10;
    }
    button {
      background: #0f0; color: #000; border: none; padding: 6px 14px;
      border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;
    }
    button:hover { background: #4f4; }
    input[type=range] {
      flex-grow: 1; cursor: pointer; background: #222; height: 4px;
      border-radius: 4px; accent-color: #0f0;
    }
    select { background: #222; color: #0f0; border: 1px solid #0f0; padding: 4px 8px; border-radius: 4px; }
    label { color: #ccc; margin-right: 4px; font-size: 12px; }
    #groupCheckboxes {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    #groupCheckboxes label { cursor: pointer; display: flex; align-items: center; gap: 3px; }
    input[type=checkbox] { accent-color: #0f0; }
    .circle {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 3px; border: 1px solid #fff;
    }
  </style>
</head>
<body>
<div id="info">
  <b>SpectraVortex — Оракул Синтеза</b><br>
  Шаг: <span id="stepLabel">0</span> | d_min: <span id="dminLabel">—</span><br>
  <span style="color:#888;">Активные элементы: <span id="activeCount">0</span></span>
</div>

<div id="oracle-panel">
  <div id="oracle-title">&lt; ОРАКУЛ СИНТЕЗА /&gt;</div>
  <div id="oracle-log"></div>
</div>

<div id="controls">
  <button id="playBtn">▶</button>
  <span id="sliderLabel" style="min-width: 60px;">1 / 50</span>
  <input type="range" id="slider" min="0" max="49" value="0" step="1">
  
  <label>Скорость:</label>
  <select id="speedSelect">
    <option value="600">0.5x</option>
    <option value="300" selected>1x</option>
    <option value="150">2x</option>
    <option value="60">5x</option>
  </select>
  
  <div style="border-left: 1px solid #333; height: 20px; margin: 0 5px;"></div>
  
  <div id="groupCheckboxes">
    <span style="color:#ccc; margin-right:5px;">Группы:</span>
  </div>
</div>

  // ========== НАСТРОЙКИ СЦЕНЫ ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);
  
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(60, 40, 80);
  
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1.0);
  document.body.appendChild(renderer.domElement);
  
  const labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0px';
  labelRenderer.domElement.style.left = '0px';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);
  
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.2;
  
  const gridHelper = new THREE.GridHelper(100, 20, 0x112233, 0x050510);
  scene.add(gridHelper);
  
  // ========== ДАННЫЕ ЭЛЕМЕНТОВ ==========
  const colors = ['#ff4444', '#44ff44', '#4488ff', '#ffaa00', '#ff44ff', '#44ffff', '#ffffff'];
  const groupNames = ['', 'K', 'L', 'M', 'N', 'O', 'P', 'Q'];
  
  const symbols = ['?', 'H','He','Li','Be','B','C','N','O','F','Ne',
    'Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co',
    'Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr','Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh',
    'Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe','Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu',
    'Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl',
    'Pb','Bi','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es',
    'Fm','Md','No','Lr'];
  
  const groupRadii = {1: 0.4, 2: 0.6, 3: 0.8, 4: 1.0, 5: 1.2, 6: 1.4, 7: 1.6};
  
  let groupObjects = {};
  let quantumLines = [];
  
  // ========== ОРАКУЛ ==========
  const oracleLog = document.getElementById('oracle-log');
  const MAX_ORACLE_LINES = 5;
  let lastOraclePairs = new Map();
  
  function addOracleLine(elA, elB, dist) {
    const now = new Date().toLocaleTimeString();
    const symbolA = elA.symbol;
    const symbolB = elB.symbol;
    
    const probability = Math.max(0, Math.round((1 - dist / 12) * 100));
    if (probability < 40) return;
    
    // Генерируем тройные соединения иногда
    const compound = Math.random() > 0.7 ? symbolA + symbolB + symbolA : symbolA + symbolB;
    
    const groupDiff = Math.abs(elA.group - elB.group);
    let stability, tHalf;
    if (groupDiff === 0) {
      stability = "СТАБИЛЕН";
      tHalf = "> 10⁶ лет";
    } else if (groupDiff <= 2) {
      stability = "МЕТАСТАБИЛЕН";
      tHalf = "~ 10² - 10⁴ лет";
    } else {
      stability = "НЕСТАБИЛЕН";
      tHalf = "< 1 мс";
    }
    
    const pairKey = [Math.min(elA.index, elB.index), Math.max(elA.index, elB.index)].join('-');
    const nowTs = Date.now();
    if (lastOraclePairs.has(pairKey) && (nowTs - lastOraclePairs.get(pairKey)) < 10000) {
      return;
    }
    lastOraclePairs.set(pairKey, nowTs);
    
    const line = document.createElement('div');
    line.className = 'oracle-line';
    line.innerHTML = `<span style="color:#fff;">[${now}]</span> <span style="color:#ff0;">${symbolA}+${symbolB}→${compound}</span> <span style="color:#0ff;">P:${probability}%</span> <span style="color:#f0f;">T½:${tHalf}</span> <span style="color:#0f0;">(${stability})</span>`;
    
    oracleLog.appendChild(line);
    while (oracleLog.children.length > MAX_ORACLE_LINES) {
      const oldLine = oracleLog.children[0];
      oldLine.classList.add('fade');
      setTimeout(() => { if (oldLine.parentNode) oldLine.parentNode.removeChild(oldLine); }, 2000);
    }
    
    requestAnimationFrame(() => { line.classList.add('show'); });
    setTimeout(() => {
      if (line.parentNode) {
        line.classList.add('fade');
        setTimeout(() => { if (line.parentNode) line.parentNode.removeChild(line); }, 2000);
      }
    }, 8000);
    
    for (const [key, ts] of lastOraclePairs.entries()) {
      if (nowTs - ts > 30000) lastOraclePairs.delete(key);
    }
  }
  
  // ========== ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ==========
  function buildCheckboxes() {
    const container = document.getElementById('groupCheckboxes');
    for (let g = 1; g <= 7; g++) {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = g; cb.checked = true;
      cb.addEventListener('change', () => loadFrame(currentFrame));
      const circle = document.createElement('span');
      circle.className = 'circle'; circle.style.backgroundColor = colors[g-1];
      label.appendChild(cb); label.appendChild(circle);
      label.appendChild(document.createTextNode(groupNames[g]));
      container.appendChild(label);
    }
  }
  
  function getVisibleGroups() {
    const cbs = document.querySelectorAll('#groupCheckboxes input[type=checkbox]');
    return Array.from(cbs).filter(cb => cb.checked).map(cb => cb.value);
  }
  
  function createAllSpheres() {
    for (let g = 1; g <= 7; g++) {
      if (groupObjects[g]) {
        groupObjects[g].forEach(obj => {
          scene.remove(obj.mesh);
        });
      }
    }
    quantumLines.forEach(line => scene.remove(line));
    quantumLines = [];
    groupObjects = {};
    
    if (!trajectoryData.length) return;
    const sampleFrame = trajectoryData[0];
    let elemCounter = 0;
    
    for (let g = 1; g <= 7; g++) {
      groupObjects[g] = [];
      if (!sampleFrame.groups[g]) continue;
      
      const color = colors[g-1];
      const count = sampleFrame.groups[g].length;
      const radius = groupRadii[g] || 0.8;
      
      const geo = new THREE.SphereGeometry(radius, 6, 4);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      
      for (let i = 0; i < count; i++) {
        const sphere = new THREE.Mesh(geo, mat);
        sphere.visible = false;
        scene.add(sphere);
        
        const div = document.createElement('div');
        const sym = symbols[elemCounter + 1] || '?';
        div.textContent = sym;
        div.style.color = '#fff'; div.style.fontSize = '11px'; div.style.fontWeight = 'bold';
        div.style.textShadow = '1px 1px 2px black'; div.style.background = 'rgba(0,0,0,0.6)';
        div.style.padding = '1px 4px'; div.style.borderRadius = '3px';
        const label = new THREE.CSS2DObject(div);
        label.visible = false;
        sphere.add(label);
        
        groupObjects[g].push({
          mesh: sphere, label: label, group: g, elementIndex: elemCounter,
          symbol: sym, index: elemCounter
        });
        elemCounter++;
      }
    }
  }
  
  function updateQuantums(visibleGroups) {
    quantumLines.forEach(line => scene.remove(line));
    quantumLines = [];
    
    const allObjs = [];
    for (let g = 1; g <= 7; g++) {
      if (!visibleGroups.includes(String(g))) continue;
      if (!groupObjects[g]) continue;
      groupObjects[g].forEach(obj => { if (obj.mesh.visible) allObjs.push(obj); });
    }
    
    const threshold = 12.0;
    const MAX_LINES = 30; // <-- УМЕНЬШИЛИ ЖЁСТКИЙ ЛИМИТ ДО 30
    let lineCount = 0;
    const linesPerAtom = new Map(); // <-- НОВЫЙ ПРЕДОХРАНИТЕЛЬ: СЧЁТЧИК ЛУЧЕЙ НА АТОМ
    const triggeredPairs = [];
    
    for (let i = 0; i < allObjs.length; i++) {
      for (let j = i + 1; j < allObjs.length; j++) {
        if (lineCount >= MAX_LINES) break; // <-- ЖЁСТКИЙ СТОП ПО ОБЩЕМУ ЛИМИТУ
        
        const objA = allObjs[i];
        const objB = allObjs[j];
        const dist = objA.mesh.position.distanceTo(objB.mesh.position);
        
        if (dist < threshold) {
            // ПРОВЕРКА НА ИНДИВИДУАЛЬНЫЙ ЛИМИТ ЛУЧЕЙ ДЛЯ АТОМА (макс 2)
            const linesA = linesPerAtom.get(objA.index) || 0;
            const linesB = linesPerAtom.get(objB.index) || 0;
            if (linesA >= 2 || linesB >= 2) continue; // Пропускаем, если у одного из атомов уже 2 луча
            
            // Рисуем луч
            const points = [objA.mesh.position.clone(), objB.mesh.position.clone()];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: Math.max(0, 1 - dist/threshold) * 0.7 });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            quantumLines.push(line);
            lineCount++;
            
            // Обновляем счётчики лучей для атомов
            linesPerAtom.set(objA.index, linesA + 1);
            linesPerAtom.set(objB.index, linesB + 1);
            
            if (dist < threshold * 0.5) triggeredPairs.push({ elA: objA, elB: objB, dist: dist });
        }
      }
      if (lineCount >= MAX_LINES) break; // <-- ЖЁСТКИЙ СТОП И ВО ВНЕШНЕМ ЦИКЛЕ ТОЖЕ
    }
    triggeredPairs.forEach(pair => addOracleLine(pair.elA, pair.elB, pair.dist));
  }
  
  function loadFrame(idx) {
    if (!trajectoryData.length) return;
    const frame = trajectoryData[idx];
    document.getElementById('stepLabel').textContent = frame.step;
    document.getElementById('dminLabel').textContent = frame.d_min.toFixed(3);
    document.getElementById('slider').value = idx;
    document.getElementById('sliderLabel').textContent = `${idx + 1} / ${trajectoryData.length}`;
    currentFrame = idx;
    const visibleGroups = getVisibleGroups();
    
    for (let g = 1; g <= 7; g++) {
      if (!groupObjects[g]) continue;
      const isVisible = visibleGroups.includes(String(g)) && frame.groups[g];
      groupObjects[g].forEach((obj, i) => {
        if (isVisible && frame.groups[g] && i < frame.groups[g].length) {
          obj.mesh.position.set(frame.groups[g][i][0], frame.groups[g][i][1], frame.groups[g][i][2]);
          obj.mesh.visible = true;
          obj.label.visible = true;
        } else {
          obj.mesh.visible = false;
          obj.label.visible = false;
        }
      });
    }
    updateQuantums(visibleGroups);
    document.getElementById('activeCount').textContent = Object.values(groupObjects).flat().filter(o => o.mesh.visible).length;
  }

  const data = JSON.parse(TRAJECTORY_JSON);
  trajectoryData = data;
  document.getElementById('slider').max = data.length - 1;
  document.getElementById('sliderLabel').textContent = `1 / ${data.length}`;
  buildCheckboxes();
  createAllSpheres();
  loadFrame(0);
  
  // ========== УПРАВЛЕНИЕ ==========
  document.getElementById('slider').addEventListener('input', e => {
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    loadFrame(parseInt(e.target.value));
  });
  document.getElementById('playBtn').addEventListener('click', () => {
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  });
  document.getElementById('speedSelect').addEventListener('change', e => {
    playSpeed = parseInt(e.target.value);
  });
  
  // ========== АНИМАЦИЯ ==========
  let lastTime = 0;
  function animate(time) {
    requestAnimationFrame(animate);
    if (playing && trajectoryData.length && time - lastTime > playSpeed) {
      lastTime = time;
      const next = (currentFrame + 1) % trajectoryData.length;
      loadFrame(next);
    }
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  requestAnimationFrame(animate);
</script>
