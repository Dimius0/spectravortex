name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # ДОБАВЛЕНО: позволяет запускать workflow вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Устанавливаем зависимости проекта из pyproject.toml
        pip install .[dev]  # Если есть дополнительные dev-зависимости
        # Явно устанавливаем pytest для тестирования
        pip install pytest
    
    - name: Run tests
      run: |
        # Пробуем оба варианта запуска тестов
        echo "=== Запуск тестов через main.py ==="
        python main.py --test || echo "Команда main.py --test завершилась с ошибкой"
        
        echo "=== Запуск тестов через pytest ==="
        python -m pytest tests/ -v || echo "Pytest завершился с ошибкой"
    
    - name: Check basic functionality
      run: |
        echo "=== Проверка импорта основных модулей ==="
        python -c "import sys; sys.path.insert(0, '.'); import compiler; import simulator; print('✓ Модули импортируются')"
